<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Stream Player</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   التطبيق
   ===================================================== */

#app {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   حاوية المشغل
   ===================================================== */

#playerContainer {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =====================================================
   أي iframe يتم إنشاؤه
   ===================================================== */

#playerContainer iframe {

    display: block;

    width: 100% !important;
    height: 100% !important;

    max-width: none !important;
    max-height: none !important;

    margin: 0 !important;
    padding: 0 !important;

    border: 0 !important;

    background: #000;

    flex: 0 0 auto;
}


/* =====================================================
   رسالة الخطأ
   ===================================================== */

#error {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    color: #fff;

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size: 15px;

    line-height: 1.6;

    display: none;

    z-index: 100;
}

</style>

</head>


<body>

<div id="app">

    <div id="playerContainer"></div>

    <div id="error"></div>

</div>


<script>

(function () {

    "use strict";


    /* =================================================
       ملفات الإعدادات
       ================================================= */

    const STREAMS_FILE =
        "streams.json";

    const IFRAMES_FILE =
        "iframes.json";


    /* =================================================
       العناصر
       ================================================= */

    const container =
        document.getElementById(
            "playerContainer"
        );

    const errorBox =
        document.getElementById(
            "error"
        );


    /* =================================================
       قراءة:

       ?stream=CH1
       ================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* =================================================
       التحقق من المفتاح
       ================================================= */

    function isValidKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(value)
        );

    }


    /* =================================================
       التحقق من URL
       ================================================= */

    function isValidURL(value) {

        try {

            const url =
                new URL(value);

            return (
                url.protocol === "https:" ||
                url.protocol === "http:"
            );

        } catch {

            return false;

        }

    }


    /* =================================================
       إظهار الخطأ
       ================================================= */

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    /* =================================================
       إخفاء الخطأ
       ================================================= */

    function hideError() {

        errorBox.textContent =
            "";

        errorBox.style.display =
            "none";

    }


    /* =================================================
       تحميل JSON
       ================================================= */

    async function loadJSON(file) {

        const response =
            await fetch(
                file +
                "?v=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "تعذر تحميل " + file
            );

        }


        return await response.json();

    }


    /* =================================================
       تنظيف iframe السابق
       ================================================= */

    function clearPlayer() {

        container.replaceChildren();

    }


    /* =================================================
       إعداد iframe
       ================================================= */

    function prepareIframe(iframe) {

        /*
         * نجعل iframe مناسبًا لمساحة WebView
         */

        iframe.style.width =
            "100%";

        iframe.style.height =
            "100%";

        iframe.style.border =
            "0";

        iframe.style.margin =
            "0";

        iframe.style.padding =
            "0";

        iframe.setAttribute(
            "scrolling",
            "no"
        );


        /*
         * Fullscreen
         */

        iframe.setAttribute(
            "allowfullscreen",
            ""
        );

        iframe.setAttribute(
            "webkitallowfullscreen",
            ""
        );

        iframe.setAttribute(
            "mozallowfullscreen",
            ""
        );


        /*
         * الصلاحيات
         */

        iframe.setAttribute(
            "allow",
            [
                "autoplay",
                "encrypted-media",
                "fullscreen",
                "picture-in-picture",
                "accelerometer",
                "clipboard-write",
                "gyroscope",
                "web-share"
            ].join("; ")
        );


        /*
         * منع ظهور scrollbars
         */

        iframe.style.overflow =
            "hidden";

    }


    /* =================================================
       تشغيل SRC
       ================================================= */

    function createFromSrc(url) {

        if (!isValidURL(url)) {

            throw new Error(
                "رابط iframe غير صالح"
            );

        }


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src = url;


        iframe.title =
            "Stream Player";


        prepareIframe(iframe);


        container.appendChild(
            iframe
        );

    }


    /* =================================================
       تشغيل iframe كامل
       ================================================= */

    function createFromCode(code) {

        if (
            typeof code !== "string" ||
            !code.trim()
        ) {

            throw new Error(
                "كود iframe فارغ"
            );

        }


        /*
         * نحول النص إلى HTML
         */

        const template =
            document.createElement(
                "template"
            );


        template.innerHTML =
            code.trim();


        /*
         * نبحث عن iframe فقط
         */

        const iframe =
            template.content
                .querySelector(
                    "iframe"
                );


        if (!iframe) {

            throw new Error(
                "لم يتم العثور على iframe داخل الكود"
            );

        }


        /*
         * ننقله إلى الصفحة
         */

        prepareIframe(iframe);


        container.appendChild(
            iframe
        );

    }


    /* =================================================
       تشغيل البث
       ================================================= */

    async function loadStream() {

        try {

            hideError();

            clearPlayer();


            /* -----------------------------------------
               التحقق من CH
               ----------------------------------------- */

            if (
                !isValidKey(streamKey)
            ) {

                throw new Error(
                    "استخدم رابطًا مثل ?stream=CH1"
                );

            }


            /* -----------------------------------------
               streams.json
               ----------------------------------------- */

            const streamsData =
                await loadJSON(
                    STREAMS_FILE
                );


            if (
                !streamsData ||
                typeof streamsData.streams !==
                    "object"
            ) {

                throw new Error(
                    "صيغة streams.json غير صحيحة"
                );

            }


            const stream =
                streamsData
                    .streams[streamKey];


            if (!stream) {

                throw new Error(
                    "القناة غير موجودة: " +
                    streamKey
                );

            }


            /* -----------------------------------------
               iframe ID
               ----------------------------------------- */

            const iframeKey =
                stream.iframe;


            if (
                !isValidKey(
                    iframeKey
                )
            ) {

                throw new Error(
                    "iframe غير محدد لهذه القناة"
                );

            }


            /* -----------------------------------------
               iframes.json
               ----------------------------------------- */

            const iframeData =
                await loadJSON(
                    IFRAMES_FILE
                );


            if (
                !iframeData ||
                typeof iframeData.iframes !==
                    "object"
            ) {

                throw new Error(
                    "صيغة iframes.json غير صحيحة"
                );

            }


            const config =
                iframeData
                    .iframes[iframeKey];


            if (!config) {

                throw new Error(
                    "المشغل غير موجود: " +
                    iframeKey
                );

            }


            /* -----------------------------------------
               تحديد نوع المصدر
               ----------------------------------------- */

            const type =
                String(
                    config.type || ""
                ).toLowerCase();


            /* -----------------------------------------
               النوع الأول:

               iframe كامل
               ----------------------------------------- */

            if (type === "iframe") {

                createFromCode(
                    config.code
                );

            }


            /* -----------------------------------------
               النوع الثاني:

               src فقط
               ----------------------------------------- */

            else if (type === "src") {

                createFromSrc(
                    config.url
                );

            }


            /* -----------------------------------------
               نوع غير معروف
               ----------------------------------------- */

            else {

                throw new Error(
                    "نوع iframe غير معروف"
                );

            }


            console.log(
                "Stream:",
                streamKey
            );

            console.log(
                "Iframe:",
                iframeKey
            );

            console.log(
                "Type:",
                type
            );


        } catch (error) {

            console.error(
                "Player Error:",
                error
            );


            clearPlayer();


            showError(
                error.message ||
                "تعذر تشغيل البث"
            );

        }

    }


    /* =================================================
       تحديث الحجم
       ================================================= */

    function resizePlayer() {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {

            return;

        }


        container.style.width =
            width + "px";

        container.style.height =
            height + "px";

    }


    /* =================================================
       البداية
       ================================================= */

    resizePlayer();

    loadStream();


    /* =================================================
       WebView Resize
       ================================================= */

    window.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );


    /* =================================================
       Orientation
       ================================================= */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                50
            );

            setTimeout(
                resizePlayer,
                200
            );

            setTimeout(
                resizePlayer,
                500
            );

        },
        {
            passive: true
        }
    );


    /* =================================================
       Android visualViewport
       ================================================= */

    if (window.visualViewport) {

        window.visualViewport
            .addEventListener(
                "resize",
                resizePlayer,
                {
                    passive: true
                }
            );

    }


    /* =================================================
       مراقبة حجم الصفحة
       ================================================= */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    resizePlayer();

                }
            );

        observer.observe(
            document.documentElement
        );

    }

})();

</script>

</body>
</html>
