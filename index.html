<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart HLS Player</title>

    <script
        src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            color: #fff;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
        }

        #loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            padding: 24px;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    #181818 0%,
                    #050505 70%
                );
        }

        .loader {
            width: 52px;
            height: 52px;

            border: 4px solid #292929;
            border-top-color: #e50914;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #status {
            max-width: 600px;

            font-size: 16px;

            line-height: 1.7;

            opacity: .92;
        }

        #error {
            display: none;

            max-width: 560px;

            padding: 18px;

            margin-top: 15px;

            border-radius: 14px;

            background: #170707;

            border: 1px solid #541616;

            color: #ff7777;

            line-height: 1.7;
        }

        #retry {
            display: none;

            margin-top: 18px;

            border: 0;

            padding: 12px 25px;

            border-radius: 10px;

            background: #e50914;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        #retry:hover {
            background: #f51a25;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="loading">

        <div
            id="spinner"
            class="loader">
        </div>

        <div id="status">
            جاري تحليل مصدر البث...
        </div>

        <div id="error"></div>

        <button
            id="retry"
            type="button">
            إعادة المحاولة
        </button>

    </div>

    <div id="player"></div>

</div>

<script>
    const API_URL = "/api/extract";

    const TARGET_URL =
        "https://daddylive.app/player/embed.php?id=91";

    const MAX_RETRIES = 3;

    let retries = 0;
    let player = null;

    const loading =
        document.getElementById("loading");

    const spinner =
        document.getElementById("spinner");

    const status =
        document.getElementById("status");

    const errorBox =
        document.getElementById("error");

    const retryButton =
        document.getElementById("retry");

    function setStatus(message) {
        status.textContent = message;
    }

    function showError(message) {
        spinner.style.display = "none";

        status.style.display = "none";

        errorBox.textContent = message;

        errorBox.style.display = "block";

        retryButton.style.display = "inline-block";
    }

    function showPlayer() {
        loading.style.display = "none";

        document
            .getElementById("player")
            .style.display = "block";
    }

    async function extract() {

        if (retries >= MAX_RETRIES) {
            retries = 0;
        }

        retries++;

        retryButton.style.display = "none";

        errorBox.style.display = "none";

        spinner.style.display = "block";

        status.style.display = "block";

        setStatus(
            `جاري البحث عن أفضل مصدر... (${retries}/${MAX_RETRIES})`
        );

        const controller =
            new AbortController();

        const timer =
            setTimeout(
                () => controller.abort(),
                30000
            );

        try {

            const response =
                await fetch(
                    `${API_URL}?url=${encodeURIComponent(TARGET_URL)}`,
                    {
                        method: "GET",
                        cache: "no-store",
                        signal: controller.signal
                    }
                );

            clearTimeout(timer);

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error(
                    "استجابة الخادم غير صالحة."
                );
            }

            if (
                !response.ok ||
                !data.success ||
                !data.stream
            ) {
                throw new Error(
                    data.error ||
                    "لم يتم العثور على مصدر بث."
                );
            }

            setStatus(
                data.verified
                    ? "تم التحقق من المصدر. جاري التشغيل..."
                    : "تم العثور على مصدر. جاري التشغيل..."
            );

            startPlayer(data.stream);

        } catch (error) {

            clearTimeout(timer);

            if (
                error.name ===
                "AbortError"
            ) {
                showError(
                    "انتهت مهلة استخراج المصدر."
                );

                return;
            }

            showError(
                error.message ||
                "حدث خطأ أثناء استخراج البث."
            );
        }
    }

    function startPlayer(source) {

        if (
            typeof Clappr ===
            "undefined"
        ) {
            showError(
                "تعذر تحميل مشغل الفيديو."
            );

            return;
        }

        if (player) {
            try {
                player.destroy();
            } catch {}
        }

        showPlayer();

        player =
            new Clappr.Player({
                source,

                parentId: "#player",

                width: "100%",

                height: "100%",

                autoPlay: true,

                mute: false,

                mimeType:
                    "application/vnd.apple.mpegurl",

                playback: {
                    preload: "auto"
                }
            });

        player.on(
            Clappr.Events.PLAYER_ERROR,
            () => {
                console.warn(
                    "Clappr player error"
                );
            }
        );
    }

    retryButton.addEventListener(
        "click",
        extract
    );

    window.addEventListener(
        "load",
        extract
    );
</script>

</body>
</html>
