<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Stream Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =========================================
   الصفحة
   ========================================= */

#page {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =========================================
   الصفحة الأفقية 16:9
   ========================================= */

#landscape {

    position: relative;

    width: min(100vw, 177.7777778vh);

    height: min(100vh, 56.25vw);

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;

    flex-shrink: 0;
}


/* =========================================
   iframe
   ========================================= */

#player {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    background: #000;
}

</style>

</head>


<body>

<div id="page">

    <div id="landscape">

        <iframe
            id="player"

            allow="
                autoplay;
                encrypted-media;
                picture-in-picture;
                fullscreen
            "

            allowfullscreen

            webkitallowfullscreen

            mozallowfullscreen

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>

(function () {

    "use strict";


    /* =========================================
       إعدادات البث
       ========================================= */

    const STREAMS_FILE =
        "streams.json";

    const PLAYER_HOST =
        "https://912acsss8af382.yasirtv.com";


    const player =
        document.getElementById("player");


    /* =========================================
       قراءة stream
       مثال:

       ?stream=match1
       ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* =========================================
       تحميل البث
       ========================================= */

    async function loadStream() {

        try {

            if (
                !streamKey ||
                !/^[A-Za-z0-9_-]+$/.test(
                    streamKey
                )
            ) {

                throw new Error(
                    "Stream غير صالح"
                );

            }


            const response =
                await fetch(
                    STREAMS_FILE +
                    "?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "تعذر تحميل streams.json"
                );

            }


            const data =
                await response.json();


            const stream =
                data?.streams?.[streamKey];


            if (!stream) {

                throw new Error(
                    "البث غير موجود"
                );

            }


            const match =
                String(stream.match);


            if (
                !/^[A-Za-z0-9_-]+$/.test(
                    match
                )
            ) {

                throw new Error(
                    "Match ID غير صالح"
                );

            }


            player.src =
                PLAYER_HOST +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    match
                );


        } catch (error) {

            console.error(
                "Player Error:",
                error
            );

        }

    }


    /* =========================================
       تشغيل
       ========================================= */

    loadStream();


})();

</script>

</body>
</html>
