<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/*
 * الحجم الأصلي لمشغل YasirTV
 * نحافظ عليه حتى لا يتغير تخطيطه الداخلي.
 */
#player {
    width: 640px;
    height: 360px;
    flex: 0 0 640px;

    transform-origin: center center;
}

#player iframe {
    display: block;
    width: 640px;
    height: 360px;
    border: 0;
    margin: 0;
    padding: 0;
}
</style>
</head>

<body>

<div id="stage">

    <div id="player">

        <iframe
            src="https://912acsss8af382.yasirtv.com/playerv5.php?match=4828487"
            frameborder="0"
            allowfullscreen
            scrolling="no">
        </iframe>

    </div>

</div>

<script>
const player = document.getElementById("player");

function resizePlayer() {

    const w = window.innerWidth;
    const h = window.innerHeight;

    const baseW = 640;
    const baseH = 360;

    /*
     * تصغير فقط عند الحاجة.
     * لا نغير الـviewport الداخلي للمشغل.
     */
    const scale = Math.min(
        1,
        w / baseW,
        h / baseH
    );

    player.style.transform =
        "scale(" + scale + ")";
}

resizePlayer();

window.addEventListener("resize", resizePlayer);

window.addEventListener("orientationchange", function () {
    setTimeout(resizePlayer, 200);
});
</script>

</body>
</html>
