<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر النقي</title>
    
    <!-- استدعاء مشغل الفيديو Clappr الأساسي -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        /* إزالة الحواف وجعل المشغل يملأ الشاشة بالكامل باللون الأسود */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // 1. رابط Cloudflare Worker الخاص بك
        const workerUrl = "https://xmsb.danapana303.workers.dev/";
        
        // 2. رابط البث المستهدف
        const targetStream = "https://daddylive.app/player/embed.php?id=91";
        
        // 3. بناء الرابط النهائي ليمر عبر خادمك
        const finalUrl = workerUrl + "?url=" + encodeURIComponent(targetStream);

        // 4. تشغيل الفيديو في موقعك مباشرة
        var player = new Clappr.Player({
            source: finalUrl,
            parentId: "#player",
            width: '100%',
            height: '100%',
            autoPlay: true,
            mute: false,
            
            // التصحيح: إخبار المشغل أن هذا الملف هو بث مباشر (HLS/m3u8) وليس صفحة ويب
            mimeType: "application/vnd.apple.mpegurl"
        });
    </script>

</body>
</html>
