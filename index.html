<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stream Player - AdBlocked</title>
    <style>
        /* =====================================================  
           RESET  
           ===================================================== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        /* =====================================================  
           التطبيق  
           ===================================================== */
        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* =====================================================  
           حاوية المشغل  
           ===================================================== */
        #playerContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* منع تفاعل المستخدم مع أي عناصر شفافة قد تغطي المشغل */
            z-index: 1; 
        }

        /* =====================================================  
           أي iframe يتم إنشاؤه  
           ===================================================== */
        #playerContainer iframe {
            display: block;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            background: #000;
            flex: 0 0 auto;
            /* منع المؤشرات الإعلانية الخارجية */
            pointer-events: auto;
        }

        /* =====================================================  
           رسالة الخطأ  
           ===================================================== */
        #error {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="playerContainer"></div>
        <div id="error"></div>
    </div>

<script>
(function () {
    "use strict";

    /* =================================================  
       ملفات الإعدادات  
       ================================================= */
    const STREAMS_FILE = "streams.json";
    const IFRAMES_FILE = "iframes.json";

    /* =================================================  
       العناصر  
       ================================================= */
    const container = document.getElementById("playerContainer");
    const errorBox = document.getElementById("error");

    /* =================================================  
       قراءة البارامترات  
       ================================================= */
    const params = new URLSearchParams(window.location.search);
    const streamKey = params.get("stream");

    /* =================================================  
       دوال مساعدة  
       ================================================= */
    function isValidKey(value) {
        return (typeof value === "string" && /^[A-Za-z0-9_-]+$/.test(value));
    }

    function isValidURL(value) {
        try {
            const url = new URL(value);
            return (url.protocol === "https:" || url.protocol === "http:");
        } catch {
            return false;
        }
    }

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    function hideError() {
        errorBox.textContent = "";
        errorBox.style.display = "none";
    }

    async function loadJSON(file) {
        const response = await fetch(file + "?v=" + Date.now(), {
            method: "GET",
            cache: "no-store"
        });
        if (!response.ok) throw new Error("تعذر تحميل " + file);
        return await response.json();
    }

    function clearPlayer() {
        container.replaceChildren();
    }

    /* =================================================  
       إعداد iframe (نظام الحماية من الإعلانات)  
       ================================================= */
    function prepareIframe(iframe) {
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "0";
        iframe.style.margin = "0";
        iframe.style.padding = "0";
        iframe.style.overflow = "hidden";
        iframe.setAttribute("scrolling", "no");
        
        iframe.setAttribute("allowfullscreen", "");
        iframe.setAttribute("webkitallowfullscreen", "");
        iframe.setAttribute("mozallowfullscreen", "");

        /* 
         * نظام الـ Sandbox (درع الحماية)
         * - allow-scripts: ضروري لتشغيل الفيديو.
         * - allow-same-origin: ضروري لجلب ملفات الفيديو.
         * - allow-presentation: لتمكين العرض بملء الشاشة.
         * 
         * المفقودات (وهي التي تمنع الإعلانات):
         * 🚫 allow-popups: يمنع النوافذ المنبثقة نهائياً.
         * 🚫 allow-top-navigation: يمنع توجيه الصفحة لموقع آخر.
         * 🚫 allow-forms: يمنع تقديم نماذج إعلانية.
         */
        iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");

        iframe.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
    }

    /* =================================================  
       إنشاء المشغل  
       ================================================= */
    function createFromSrc(url) {
        if (!isValidURL(url)) throw new Error("رابط iframe غير صالح");
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.title = "Stream Player";
        prepareIframe(iframe);
        container.appendChild(iframe);
    }

    function createFromCode(code) {
        if (typeof code !== "string" || !code.trim()) throw new Error("كود iframe فارغ");
        const template = document.createElement("template");
        template.innerHTML = code.trim();
        const iframe = template.content.querySelector("iframe");
        if (!iframe) throw new Error("لم يتم العثور على iframe داخل الكود");
        prepareIframe(iframe);
        container.appendChild(iframe);
    }

    /* =================================================  
       تحميل البث  
       ================================================= */
    async function loadStream() {
        try {
            hideError();
            clearPlayer();

            if (!isValidKey(streamKey)) throw new Error("استخدم رابطًا مثل ?stream=CH1");

            const streamsData = await loadJSON(STREAMS_FILE);
            if (!streamsData || typeof streamsData.streams !== "object") throw new Error("صيغة streams.json غير صحيحة");
            const stream = streamsData.streams[streamKey];
            if (!stream) throw new Error("القناة غير موجودة: " + streamKey);

            const iframeKey = stream.iframe;
            if (!isValidKey(iframeKey)) throw new Error("iframe غير محدد لهذه القناة");

            const iframeData = await loadJSON(IFRAMES_FILE);
            if (!iframeData || typeof iframeData.iframes !== "object") throw new Error("صيغة iframes.json غير صحيحة");
            const config = iframeData.iframes[iframeKey];
            if (!config) throw new Error("المشغل غير موجود: " + iframeKey);

            const type = String(config.type || "").toLowerCase();

            if (type === "iframe") {
                createFromCode(config.code);
            } else if (type === "src") {
                createFromSrc(config.url);
            } else {
                throw new Error("نوع iframe غير معروف");
            }

        } catch (error) {
            console.error("Player Error:", error);
            clearPlayer();
            showError(error.message || "تعذر تشغيل البث");
        }
    }

    /* =================================================  
       إدارة الحجم والاستجابة  
       ================================================= */
    function resizePlayer() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        if (width <= 0 || height <= 0) return;
        container.style.width = width + "px";
        container.style.height = height + "px";
    }

    resizePlayer();
    loadStream();

    window.addEventListener("resize", resizePlayer, { passive: true });
    window.addEventListener("orientationchange", function () {
        setTimeout(resizePlayer, 50);
        setTimeout(resizePlayer, 200);
        setTimeout(resizePlayer, 500);
    }, { passive: true });

    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizePlayer, { passive: true });
    }

    if (window.ResizeObserver) {
        const observer = new ResizeObserver(resizePlayer);
        observer.observe(document.documentElement);
    }
})();
</script>
</body>
</html>
