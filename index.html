<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Stream Player</title>

<style>

/* ==================================================
   RESET
   ================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}


/* ==================================================
   التطبيق
   ================================================== */

#app {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* ==================================================
   حاوية المشغل
   ================================================== */

#playerContainer {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* ==================================================
   iframe واحد فقط
   ================================================== */

#player {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    background: #000;
}


/* ==================================================
   رسالة الخطأ
   ================================================== */

#error {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    color: #fff;

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size: 15px;

    display: none;

    z-index: 10;
}

</style>

</head>


<body>

<div id="app">

    <!-- iframe واحد فقط -->

    <div id="playerContainer">

        <iframe
            id="player"

            title="Stream Player"

            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "

            allowfullscreen

            webkitallowfullscreen

            mozallowfullscreen

            scrolling="no"

            frameborder="0"

            referrerpolicy="no-referrer">
        </iframe>

    </div>


    <div id="error"></div>

</div>


<script>

(function () {

    "use strict";


    /* ==================================================
       الإعدادات
       ================================================== */

    const STREAMS_FILE =
        "streams.json";

    const IFRAMES_FILE =
        "iframes.json";


    /* ==================================================
       العناصر
       ================================================== */

    const player =
        document.getElementById(
            "player"
        );

    const errorBox =
        document.getElementById(
            "error"
        );


    /* ==================================================
       قراءة ?stream=CH1
       ================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* ==================================================
       التحقق من المفتاح
       ================================================== */

    function isValidKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(
                value
            )
        );

    }


    /* ==================================================
       التحقق من الرابط
       ================================================== */

    function isValidURL(value) {

        try {

            const url =
                new URL(value);

            return (
                url.protocol === "https:" ||
                url.protocol === "http:"
            );

        } catch {

            return false;

        }

    }


    /* ==================================================
       إظهار الخطأ
       ================================================== */

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    /* ==================================================
       إخفاء الخطأ
       ================================================== */

    function hideError() {

        errorBox.textContent = "";

        errorBox.style.display =
            "none";

    }


    /* ==================================================
       تحميل JSON
       ================================================== */

    async function getJSON(file) {

        const response =
            await fetch(
                file +
                "?v=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Cannot load " + file
            );

        }


        return await response.json();

    }


    /* ==================================================
       تشغيل القناة
       ================================================== */

    async function loadStream() {

        try {

            hideError();


            /* ------------------------------------------
               التحقق من CH
               ------------------------------------------ */

            if (
                !isValidKey(streamKey)
            ) {

                throw new Error(
                    "Stream ID غير صالح"
                );

            }


            /* ------------------------------------------
               تحميل streams.json
               ------------------------------------------ */

            const streamsData =
                await getJSON(
                    STREAMS_FILE
                );


            if (
                !streamsData ||
                !streamsData.streams
            ) {

                throw new Error(
                    "streams.json غير صحيح"
                );

            }


            /* ------------------------------------------
               الحصول على القناة
               ------------------------------------------ */

            const stream =
                streamsData
                    .streams[streamKey];


            if (!stream) {

                throw new Error(
                    "القناة غير موجودة: " +
                    streamKey
                );

            }


            /* ------------------------------------------
               الحصول على iframe ID
               ------------------------------------------ */

            const iframeKey =
                stream.iframe;


            if (
                !isValidKey(
                    iframeKey
                )
            ) {

                throw new Error(
                    "iframe ID غير صالح"
                );

            }


            /* ------------------------------------------
               تحميل iframes.json
               ------------------------------------------ */

            const iframeData =
                await getJSON(
                    IFRAMES_FILE
                );


            if (
                !iframeData ||
                !iframeData.iframes
            ) {

                throw new Error(
                    "iframes.json غير صحيح"
                );

            }


            /* ------------------------------------------
               الحصول على المشغل
               ------------------------------------------ */

            const iframeConfig =
                iframeData
                    .iframes[iframeKey];


            if (!iframeConfig) {

                throw new Error(
                    "iframe غير موجود: " +
                    iframeKey
                );

            }


            /* ------------------------------------------
               الحصول على URL
               ------------------------------------------ */

            const url =
                iframeConfig.url;


            if (
                !isValidURL(url)
            ) {

                throw new Error(
                    "رابط iframe غير صالح"
                );

            }


            /* ------------------------------------------
               تشغيل الرابط
               ------------------------------------------ */

            player.src = url;


            console.log(
                "Stream:",
                streamKey
            );

            console.log(
                "Iframe:",
                iframeKey
            );

            console.log(
                "URL:",
                url
            );


        } catch (error) {

            console.error(
                "Player Error:",
                error
            );


            player.removeAttribute(
                "src"
            );


            showError(
                "تعذر تشغيل البث"
            );

        }

    }


    /* ==================================================
       إعادة ضبط الحجم
       ================================================== */

    function resizePlayer() {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {

            return;

        }


        /*
         * iframe يأخذ بالضبط
         * مساحة WebView.
         *
         * لا يوجد:
         * 94%
         * 96%
         * scale
         * margin
         * خصم من الأسفل
         */

        player.style.width =
            width + "px";

        player.style.height =
            height + "px";

    }


    /* ==================================================
       بداية الصفحة
       ================================================== */

    resizePlayer();

    loadStream();


    /* ==================================================
       تغيير الحجم
       ================================================== */

    window.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );


    /* ==================================================
       تغيير الاتجاه
       ================================================== */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                50
            );

            setTimeout(
                resizePlayer,
                200
            );

            setTimeout(
                resizePlayer,
                500
            );

        },
        {
            passive: true
        }
    );


    /* ==================================================
       Android WebView
       ================================================== */

    if (window.visualViewport) {

        window.visualViewport
            .addEventListener(
                "resize",
                resizePlayer,
                {
                    passive: true
                }
            );

    }


    /* ==================================================
       ResizeObserver
       ================================================== */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    resizePlayer();

                }
            );

        observer.observe(
            document.documentElement
        );

    }


})();

</script>

</body>
</html>
