<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}

/*
 * الشاشة الكاملة
 */
#stage {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}


/*
 * صندوق 16:9 حقيقي
 *
 * هذا هو الجزء المهم.
 * لا نجعل YasirTV يأخذ نسبة الشاشة
 * إذا كانت الشاشة عريضة جدًا.
 */
#videoArea {
    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 100%;
    max-height: 100%;

    aspect-ratio: 16 / 9;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    overflow: hidden;
}


/*
 * iframe الداخلي
 */
#player {
    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    border: 0;
    margin: 0;
    padding: 0;

    display: block;

    background: #000;
}
</style>
</head>

<body>

<div id="stage">

    <div id="videoArea">

        <iframe
            id="player"
            title="Video Player"
            allow="autoplay; encrypted-media; picture-in-picture"
            scrolling="no"
            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>
(function () {

    "use strict";

    const STREAMS_FILE = "streams.json";

    const PLAYER_HOST =
        "https://912acsss8af382.yasirtv.com";

    const stage =
        document.getElementById("stage");

    const videoArea =
        document.getElementById("videoArea");

    const player =
        document.getElementById("player");


    /*
     * قراءة اسم البث
     *
     * ?stream=match1
     */
    const params =
        new URLSearchParams(
            location.search
        );

    const streamKey =
        params.get("stream");


    function validKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(value)
        );

    }


    /*
     * حساب مساحة 16:9 الصحيحة
     */
    function resizeVideoArea() {

        const stageWidth =
            stage.clientWidth;

        const stageHeight =
            stage.clientHeight;


        if (
            stageWidth <= 0 ||
            stageHeight <= 0
        ) {
            return;
        }


        const ratio =
            16 / 9;


        /*
         * أولاً نفترض أن العرض هو العامل المحدد
         */
        let width =
            stageWidth;

        let height =
            width / ratio;


        /*
         * إذا كان الارتفاع أكبر من الشاشة،
         * نعتمد الارتفاع بدل العرض.
         */
        if (height > stageHeight) {

            height =
                stageHeight;

            width =
                height * ratio;

        }


        /*
         * نحولها لأرقام صحيحة
         */
        width =
            Math.floor(width);

        height =
            Math.floor(height);


        /*
         * تطبيق الحجم الحقيقي
         */
        videoArea.style.width =
            width + "px";

        videoArea.style.height =
            height + "px";

    }


    /*
     * تحميل البث من streams.json
     */
    async function loadStream() {

        try {

            if (!validKey(streamKey)) {

                throw new Error(
                    "Invalid stream"
                );

            }


            const response =
                await fetch(
                    STREAMS_FILE +
                    "?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Cannot load streams.json"
                );

            }


            const data =
                await response.json();


            const stream =
                data?.streams?.[streamKey];


            if (!stream) {

                throw new Error(
                    "Stream not found"
                );

            }


            if (
                typeof stream.match !== "string" ||
                !/^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {

                throw new Error(
                    "Invalid match ID"
                );

            }


            /*
             * تشغيل YasirTV
             */
            player.src =
                PLAYER_HOST +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    stream.match
                );


        } catch (error) {

            console.error(error);

            /*
             * لا نعرض تفاصيل الخطأ داخل المشغل
             */
            player.removeAttribute("src");

        }

    }


    /*
     * تشغيل أولي
     */
    resizeVideoArea();

    loadStream();


    /*
     * تغيير الحجم
     */
    window.addEventListener(
        "resize",
        resizeVideoArea,
        {
            passive: true
        }
    );


    /*
     * تغيير الاتجاه
     */
    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizeVideoArea,
                50
            );

            setTimeout(
                resizeVideoArea,
                250
            );

            setTimeout(
                resizeVideoArea,
                600
            );

        },
        {
            passive: true
        }
    );


    /*
     * visualViewport
     */
    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            resizeVideoArea,
            {
                passive: true
            }
        );

    }


    /*
     * مراقبة تغيّر حجم WebView
     */
    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    resizeVideoArea();

                }
            );

        observer.observe(stage);

    }

})();
</script>

</body>
</html>
