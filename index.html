<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Player</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    position: fixed;
    inset: 0;
}


/* =========================================
   المساحة الكاملة
   ========================================= */

#stage {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =========================================
   إطار الفيديو الحقيقي
   ========================================= */

#videoBox {

    position: relative;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    flex-shrink: 0;
}


/* =========================================
   iframe
   ========================================= */

#player {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    background: #000;
}

</style>
</head>


<body>

<div id="stage">

    <div id="videoBox">

        <iframe
            id="player"
            title="Video Player"

            allow="
                autoplay;
                encrypted-media;
                picture-in-picture
            "

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>

(function () {

    "use strict";


    /* =========================================
       الإعدادات
       ========================================= */

    const STREAMS_FILE = "streams.json";

    const PLAYER_HOST =
        "https://912acsss8af382.yasirtv.com";


    const stage =
        document.getElementById("stage");

    const videoBox =
        document.getElementById("videoBox");

    const player =
        document.getElementById("player");


    /* =========================================
       Stream ID
       ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* =========================================
       التحقق
       ========================================= */

    function validKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(value)
        );

    }


    /* =========================================
       حساب الفيديو بدقة
       ========================================= */

    function resizePlayer() {

        /*
         * نأخذ الحجم الحقيقي للـWebView
         */

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {
            return;
        }


        /*
         * 16:9
         */

        const ratio = 16 / 9;


        let videoWidth;
        let videoHeight;


        /*
         * Landscape
         */

        if (width >= height) {

            /*
             * نعتمد الارتفاع الحقيقي
             */

            videoHeight = height;

            videoWidth =
                videoHeight * ratio;


            /*
             * حماية من تجاوز العرض
             */

            if (videoWidth > width) {

                videoWidth = width;

                videoHeight =
                    videoWidth / ratio;

            }

        }

        /*
         * Portrait
         */

        else {

            /*
             * نعتمد العرض
             */

            videoWidth = width;

            videoHeight =
                videoWidth / ratio;


            /*
             * حماية من تجاوز الارتفاع
             */

            if (videoHeight > height) {

                videoHeight = height;

                videoWidth =
                    videoHeight * ratio;

            }

        }


        /*
         * تقريب بدون كسور
         */

        videoWidth =
            Math.floor(videoWidth);

        videoHeight =
            Math.floor(videoHeight);


        /*
         * تطبيق الحجم
         */

        videoBox.style.width =
            videoWidth + "px";

        videoBox.style.height =
            videoHeight + "px";

    }


    /* =========================================
       تحميل البث
       ========================================= */

    async function loadStream() {

        try {

            if (!validKey(streamKey)) {

                throw new Error(
                    "Invalid stream"
                );

            }


            const response =
                await fetch(
                    STREAMS_FILE +
                    "?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "streams.json error"
                );

            }


            const data =
                await response.json();


            const stream =
                data?.streams?.[streamKey];


            if (!stream) {

                throw new Error(
                    "Stream not found"
                );

            }


            if (
                typeof stream.match !== "string" ||
                !/^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {

                throw new Error(
                    "Invalid match ID"
                );

            }


            /*
             * رابط المشغل الأصلي
             */

            player.src =
                PLAYER_HOST +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    stream.match
                );


        } catch (error) {

            console.error(
                "Player error:",
                error
            );

            player.removeAttribute(
                "src"
            );

        }

    }


    /* =========================================
       البداية
       ========================================= */

    resizePlayer();

    loadStream();


    /* =========================================
       Resize
       ========================================= */

    window.addEventListener(
        "resize",
        function () {

            resizePlayer();

        },
        {
            passive: true
        }
    );


    /* =========================================
       Orientation
       ========================================= */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                50
            );

            setTimeout(
                resizePlayer,
                150
            );

            setTimeout(
                resizePlayer,
                350
            );

            setTimeout(
                resizePlayer,
                700
            );

        },
        {
            passive: true
        }
    );


    /* =========================================
       visualViewport
       ========================================= */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            resizePlayer,
            {
                passive: true
            }
        );

    }


    /* =========================================
       ResizeObserver
       ========================================= */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    resizePlayer();

                }
            );

        observer.observe(stage);

    }


})();

</script>

</body>
</html>
