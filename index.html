<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Player</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;
}

#stage {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    overflow: hidden;
}

/*
 * الحاوية الحقيقية للمشغل
 */
#playerBox {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/*
 * iframe
 *
 * يتم تحديد حجمه بواسطة JavaScript
 * للحفاظ على نسبة 16:9
 */
#player {
    display: block;

    width: 640px;
    height: 360px;

    border: 0;
    margin: 0;
    padding: 0;

    flex: none;

    background: #000;
}
</style>
</head>

<body>

<div id="stage">

    <div id="playerBox">

        <iframe
            id="player"
            title="Video Player"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen
            webkitallowfullscreen="true"
            scrolling="no"
            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>

<script>
(function () {

    "use strict";

    const params =
        new URLSearchParams(window.location.search);

    const match =
        params.get("match") || "4828487";

    /*
     * حماية رقم المباراة
     */
    if (!/^[A-Za-z0-9_-]+$/.test(match)) {
        document.body.innerHTML = "";
        return;
    }

    const player =
        document.getElementById("player");

    /*
     * رابط المشغل الأصلي
     */
    player.src =
        "https://912acsss8af382.yasirtv.com/playerv5.php?match=" +
        encodeURIComponent(match);


    /*
     * تغيير الحجم تلقائيًا
     */
    function resizePlayer() {

        const box =
            document.getElementById("playerBox");

        const availableWidth =
            box.clientWidth;

        const availableHeight =
            box.clientHeight;

        /*
         * نسبة المشغل الأصلية
         */
        const aspectRatio =
            16 / 9;

        /*
         * نحسب الحجم المناسب للعرض
         */
        let width =
            availableWidth;

        let height =
            width / aspectRatio;

        /*
         * إذا أصبح الارتفاع أكبر من المساحة
         * المتاحة، نعتمد الارتفاع بدل العرض
         */
        if (height > availableHeight) {

            height =
                availableHeight;

            width =
                height * aspectRatio;
        }

        /*
         * هامش بسيط جدًا حتى لا يحدث قص
         * بسبب اختلافات WebView
         */
        const safeMargin = 0.98;

        width *= safeMargin;
        height *= safeMargin;

        /*
         * تطبيق الحجم النهائي
         */
        player.style.width =
            Math.floor(width) + "px";

        player.style.height =
            Math.floor(height) + "px";
    }


    /*
     * تشغيل أولي
     */
    resizePlayer();


    /*
     * مراقبة أي تغيير حقيقي في حجم WebView
     */
    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(function () {

                resizePlayer();

            });

        observer.observe(
            document.getElementById("stage")
        );

    }


    /*
     * احتياط للمتصفحات/WebView القديمة
     */
    window.addEventListener(
        "resize",
        resizePlayer,
        { passive: true }
    );


    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                300
            );

        },
        { passive: true }
    );


    /*
     * منع Pop-ups من الصفحة الوسيطة
     */
    window.open = function () {
        return null;
    };


    /*
     * منع فتح تبويبات جديدة
     */
    document.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest &&
                event.target.closest("a");

            if (!link) return;

            if (link.target === "_blank") {

                event.preventDefault();

                event.stopImmediatePropagation();
            }

        },
        true
    );

})();
</script>

</body>
</html>
