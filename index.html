<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Video Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;

    overscroll-behavior: none;
}

#stage {
    position: fixed;

    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;
}

#playerBox {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;

    flex: 0 0 auto;
}

#player {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;
    margin: 0;
    padding: 0;

    background: #000;

    flex: 0 0 auto;
}
</style>
</head>

<body>

<div id="stage">

    <div id="playerBox">

        <iframe
            id="player"
            title="Video Player"

            allow="autoplay; encrypted-media; picture-in-picture"

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>

<script>
(function () {

    "use strict";

    /* ==============================
       الإعدادات
       ============================== */

    const CONFIG = {

        streamsFile: "streams.json",

        playerHost:
            "https://912acsss8af382.yasirtv.com",

        aspectRatio: 16 / 9,

        /*
         * هامش أمان حتى لا يخرج
         * أي جزء خارج الشاشة
         */
        safety: 0.94

    };


    /* ==============================
       العناصر
       ============================== */

    const stage =
        document.getElementById("stage");

    const box =
        document.getElementById("playerBox");

    const player =
        document.getElementById("player");


    /* ==============================
       قراءة stream من الرابط
       ============================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* ==============================
       التحقق من اسم البث
       ============================== */

    function validKey(key) {

        return (
            typeof key === "string" &&
            /^[A-Za-z0-9_-]+$/.test(key)
        );

    }


    /* ==============================
       تحميل streams.json
       ============================== */

    async function loadStream() {

        try {

            if (!validKey(streamKey)) {
                throw new Error(
                    "Invalid stream"
                );
            }


            const response =
                await fetch(
                    CONFIG.streamsFile,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {
                throw new Error(
                    "streams.json unavailable"
                );
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.streams ||
                !data.streams[streamKey]
            ) {
                throw new Error(
                    "Stream not found"
                );
            }


            const stream =
                data.streams[streamKey];


            if (
                typeof stream.match !== "string" ||
                !/^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {
                throw new Error(
                    "Invalid match ID"
                );
            }


            /*
             * إنشاء رابط YasirTV
             */

            player.src =
                CONFIG.playerHost +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    stream.match
                );


        } catch (error) {

            console.error(error);

            /*
             * لا نعرض تفاصيل الخطأ
             */

            document.body.innerHTML = "";

        }

    }


    /* ==============================
       الحصول على حجم الشاشة الحقيقي
       ============================== */

    function getViewport() {

        let width =
            document.documentElement.clientWidth;

        let height =
            document.documentElement.clientHeight;


        /*
         * visualViewport
         */

        if (window.visualViewport) {

            if (
                window.visualViewport.width > 0
            ) {

                width =
                    Math.min(
                        width,
                        window.visualViewport.width
                    );

            }

            if (
                window.visualViewport.height > 0
            ) {

                height =
                    Math.min(
                        height,
                        window.visualViewport.height
                    );

            }

        }


        return {

            width:
                Math.max(1, width),

            height:
                Math.max(1, height)

        };

    }


    /* ==============================
       ضبط حجم المشغل
       ============================== */

    function resizePlayer() {

        const viewport =
            getViewport();


        const stageWidth =
            stage.clientWidth ||
            viewport.width;

        const stageHeight =
            stage.clientHeight ||
            viewport.height;


        /*
         * مساحة آمنة
         */

        const availableWidth =
            stageWidth *
            CONFIG.safety;

        const availableHeight =
            stageHeight *
            CONFIG.safety;


        /*
         * حساب 16:9
         */

        let width =
            availableWidth;

        let height =
            width /
            CONFIG.aspectRatio;


        /*
         * إذا كان الارتفاع أكبر
         * من المساحة المتاحة
         */

        if (
            height >
            availableHeight
        ) {

            height =
                availableHeight;

            width =
                height *
                CONFIG.aspectRatio;

        }


        /*
         * حماية إضافية
         */

        width =
            Math.min(
                width,
                availableWidth
            );

        height =
            Math.min(
                height,
                availableHeight
            );


        /*
         * تقريب للأسفل
         */

        width =
            Math.max(
                1,
                Math.floor(width)
            );

        height =
            Math.max(
                1,
                Math.floor(height)
            );


        /*
         * تطبيق الحجم
         */

        box.style.width =
            width + "px";

        box.style.height =
            height + "px";

        player.style.width =
            width + "px";

        player.style.height =
            height + "px";

    }


    /* ==============================
       مراقبة حجم الصفحة
       ============================== */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {
                    resizePlayer();
                }
            );

        observer.observe(stage);

    }


    /* ==============================
       تغيير حجم النافذة
       ============================== */

    window.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );


    /* ==============================
       تغيير الاتجاه
       ============================== */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                100
            );

            setTimeout(
                resizePlayer,
                400
            );

            setTimeout(
                resizePlayer,
                800
            );

        },
        {
            passive: true
        }
    );


    /* ==============================
       visualViewport
       ============================== */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            resizePlayer,
            {
                passive: true
            }
        );

    }


    /* ==============================
       بعد تحميل iframe
       ============================== */

    player.addEventListener(
        "load",
        function () {

            setTimeout(
                resizePlayer,
                100
            );

            setTimeout(
                resizePlayer,
                500
            );

        }
    );


    /* ==============================
       منع Pop-up من الصفحة الوسيطة
       ============================== */

    window.open = function () {
        return null;
    };


    /* ==============================
       منع فتح تبويبات جديدة
       ============================== */

    document.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest &&
                event.target.closest("a");


            if (!link) {
                return;
            }


            if (
                link.target === "_blank" ||
                link.target === "_new"
            ) {

                event.preventDefault();

                event.stopImmediatePropagation();

            }

        },
        true
    );


    /* ==============================
       البداية
       ============================== */

    resizePlayer();

    loadStream();


})();
</script>

</body>
</html>
