<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Video Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    overscroll-behavior: none;
}


/* =========================
   المشغل
   ========================= */

#stage {

    position: fixed;

    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;
}


#playerBox {

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;

    flex: 0 0 auto;
}


#player {

    display: block;

    width: 1px;
    height: 1px;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    flex: 0 0 auto;
}

</style>
</head>

<body>


<div id="stage">

    <div id="playerBox">

        <iframe
            id="player"

            title="Video Player"

            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "

            allowfullscreen
            webkitallowfullscreen="true"

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>

(function () {

"use strict";


/* =====================================================
   الإعدادات
   ===================================================== */

const CONFIG = {

    /*
     * ملف البثوث
     */
    streamsFile: "streams.json",

    /*
     * الدومين الخاص بالمشغل
     */
    playerHost:
        "https://912acsss8af382.yasirtv.com",

    /*
     * نسبة المشغل
     */
    aspectRatio: 16 / 9,

    /*
     * هامش أمان
     */
    safety: 0.96

};


/* =====================================================
   العناصر
   ===================================================== */

const stage =
    document.getElementById("stage");

const box =
    document.getElementById("playerBox");

const player =
    document.getElementById("player");


/* =====================================================
   الحصول على اسم البث من الرابط
   ===================================================== */

/*
   مثال:

   ?stream=match1

   ?stream=match2
*/

const params =
    new URLSearchParams(
        window.location.search
    );

const streamKey =
    params.get("stream");


/* =====================================================
   التحقق من اسم البث
   ===================================================== */

function validKey(key) {

    return (
        typeof key === "string" &&
        /^[A-Za-z0-9_-]+$/.test(key)
    );

}


/* =====================================================
   تحميل الإعدادات
   ===================================================== */

async function loadStream() {

    try {

        if (!validKey(streamKey)) {

            throw new Error(
                "Invalid stream"
            );

        }


        const response =
            await fetch(
                CONFIG.streamsFile,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load streams.json"
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !data.streams ||
            !data.streams[streamKey]
        ) {

            throw new Error(
                "Stream not found"
            );

        }


        const stream =
            data.streams[streamKey];


        /*
         * التحقق من Match ID
         */

        if (
            typeof stream.match !== "string" ||
            !/^[A-Za-z0-9_-]+$/.test(
                stream.match
            )
        ) {

            throw new Error(
                "Invalid match ID"
            );

        }


        /*
         * إنشاء رابط المشغل
         */

        const url =
            CONFIG.playerHost +
            "/playerv5.php?match=" +
            encodeURIComponent(
                stream.match
            );


        /*
         * تشغيل المشغل
         */

        player.src = url;


    } catch (error) {

        console.error(error);

        /*
         * لا نعرض تفاصيل داخلية للمستخدم
         */

        document.body.innerHTML = "";

    }

}


/* =====================================================
   حساب حجم المشغل
   ===================================================== */

function getViewportSize() {

    let width =
        document.documentElement.clientWidth;

    let height =
        document.documentElement.clientHeight;


    /*
     * visualViewport
     */

    if (window.visualViewport) {

        if (
            window.visualViewport.width > 0
        ) {

            width =
                Math.min(
                    width,
                    window.visualViewport.width
                );

        }


        if (
            window.visualViewport.height > 0
        ) {

            height =
                Math.min(
                    height,
                    window.visualViewport.height
                );

        }

    }


    return {

        width:
            Math.max(1, width),

        height:
            Math.max(1, height)

    };

}


/* =====================================================
   Resize احترافي
   ===================================================== */

function resizePlayer() {

    const viewport =
        getViewportSize();


    const stageWidth =
        stage.clientWidth ||
        viewport.width;

    const stageHeight =
        stage.clientHeight ||
        viewport.height;


    /*
     * هامش أمان
     */

    const availableWidth =
        stageWidth *
        CONFIG.safety;

    const availableHeight =
        stageHeight *
        CONFIG.safety;


    /*
     * حساب 16:9
     */

    let width =
        availableWidth;

    let height =
        width /
        CONFIG.aspectRatio;


    /*
     * إذا كان الارتفاع أكبر
     */

    if (
        height >
        availableHeight
    ) {

        height =
            availableHeight;

        width =
            height *
            CONFIG.aspectRatio;

    }


    /*
     * حماية إضافية
     */

    width =
        Math.min(
            width,
            availableWidth
        );

    height =
        Math.min(
            height,
            availableHeight
        );


    /*
     * التقريب للأسفل
     */

    width =
        Math.max(
            1,
            Math.floor(width)
        );

    height =
        Math.max(
            1,
            Math.floor(height)
        );


    /*
     * تطبيق الحجم
     */

    box.style.width =
        width + "px";

    box.style.height =
        height + "px";


    player.style.width =
        width + "px";

    player.style.height =
        height + "px";

}


/* =====================================================
   Fullscreen
   ===================================================== */

async function enterFullscreen() {

    try {

        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ) {

            return;

        }


        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen({
                    navigationUI: "hide"
                });

            return;

        }


        if (
            document.documentElement
                .webkitRequestFullscreen
        ) {

            document.documentElement
                .webkitRequestFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen unavailable"
        );

    }

}


/* =====================================================
   محاولة Fullscreen
   ===================================================== */

setTimeout(
    enterFullscreen,
    500
);


/* =====================================================
   Fullscreen عند أول لمس
   ===================================================== */

function firstInteraction() {

    enterFullscreen();

    document.removeEventListener(
        "touchstart",
        firstInteraction
    );

    document.removeEventListener(
        "click",
        firstInteraction
    );

}


document.addEventListener(
    "touchstart",
    firstInteraction,
    {
        passive: true,
        once: true
    }
);


document.addEventListener(
    "click",
    firstInteraction,
    {
        passive: true,
        once: true
    }
);


/* =====================================================
   ResizeObserver
   ===================================================== */

if (window.ResizeObserver) {

    const observer =
        new ResizeObserver(
            resizePlayer
        );

    observer.observe(stage);

}


/* =====================================================
   Window Resize
   ===================================================== */

window.addEventListener(
    "resize",
    resizePlayer,
    {
        passive: true
    }
);


/* =====================================================
   Orientation
   ===================================================== */

window.addEventListener(
    "orientationchange",
    function () {

        setTimeout(
            resizePlayer,
            100
        );

        setTimeout(
            resizePlayer,
            400
        );

        setTimeout(
            resizePlayer,
            800
        );

    },
    {
        passive: true
    }
);


/* =====================================================
   Visual Viewport
   ===================================================== */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );

}


/* =====================================================
   Fullscreen Change
   ===================================================== */

document.addEventListener(
    "fullscreenchange",
    function () {

        setTimeout(
            resizePlayer,
            100
        );

        setTimeout(
            resizePlayer,
            500
        );

    }
);


/* =====================================================
   تحميل المشغل
   ===================================================== */

player.addEventListener(
    "load",
    function () {

        setTimeout(
            resizePlayer,
            100
        );

        setTimeout(
            resizePlayer,
            500
        );

    }
);


/* =====================================================
   منع Popups في الصفحة الوسيطة
   ===================================================== */

window.open = function () {

    return null;

};


/* =====================================================
   منع فتح تبويبات جديدة
   ===================================================== */

document.addEventListener(
    "click",
    function (event) {

        const link =
            event.target.closest &&
            event.target.closest("a");


        if (!link) {

            return;

        }


        if (
            link.target === "_blank" ||
            link.target === "_new"
        ) {

            event.preventDefault();

            event.stopImmediatePropagation();

        }

    },
    true
);


/* =====================================================
   البداية
   ===================================================== */

resizePlayer();

loadStream();


})();

</script>

</body>
</html>
