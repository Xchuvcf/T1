<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Player</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;

    /* منع أي تمدد إضافي */
    box-sizing: border-box;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

#stage {
    position: fixed;

    /*
     * Safe Area
     */
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);

    width: auto;
    height: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;
}

#player {
    display: block;

    /*
     * JavaScript يحدد الحجم الحقيقي
     */
    width: 1px;
    height: 1px;

    max-width: 100%;
    max-height: 100%;

    flex: 0 0 auto;

    border: 0;
    margin: 0;
    padding: 0;

    background: #000;
}
</style>
</head>

<body>

<div id="stage">

    <iframe
        id="player"
        title="Video Player"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen="true"
        scrolling="no"
        referrerpolicy="no-referrer">
    </iframe>

</div>

<script>
(function () {

    "use strict";

    const params =
        new URLSearchParams(window.location.search);

    const match =
        params.get("match") || "4828487";

    if (!/^[A-Za-z0-9_-]+$/.test(match)) {
        document.body.innerHTML = "";
        return;
    }

    const player =
        document.getElementById("player");

    const stage =
        document.getElementById("stage");

    /*
     * رابط YasirTV
     */
    player.src =
        "https://912acsss8af382.yasirtv.com/playerv5.php?match=" +
        encodeURIComponent(match);


    /*
     * الحصول على الحجم الحقيقي المتاح
     */
    function getViewportSize() {

        let width =
            document.documentElement.clientWidth;

        let height =
            document.documentElement.clientHeight;

        /*
         * visualViewport أدق داخل WebView
         */
        if (window.visualViewport) {

            if (window.visualViewport.width > 0) {
                width =
                    Math.min(
                        width,
                        window.visualViewport.width
                    );
            }

            if (window.visualViewport.height > 0) {
                height =
                    Math.min(
                        height,
                        window.visualViewport.height
                    );
            }
        }

        return {
            width: Math.max(1, width),
            height: Math.max(1, height)
        };
    }


    /*
     * ضبط حجم المشغل
     */
    function resizePlayer() {

        const viewport =
            getViewportSize();

        /*
         * نستخدم مساحة stage الفعلية
         */
        const stageWidth =
            Math.min(
                viewport.width,
                stage.clientWidth
            );

        const stageHeight =
            Math.min(
                viewport.height,
                stage.clientHeight
            );

        /*
         * هامش أمان
         *
         * يمنع خروج أي جزء من المشغل
         * بسبب فروقات WebView / Status Bar / Navigation Bar
         */
        const safety = 0.94;

        const availableWidth =
            Math.max(
                1,
                stageWidth * safety
            );

        const availableHeight =
            Math.max(
                1,
                stageHeight * safety
            );

        /*
         * النسبة الأصلية 16:9
         */
        const ratio = 16 / 9;

        let width =
            availableWidth;

        let height =
            width / ratio;

        /*
         * إذا كان الارتفاع أكبر من المساحة
         */
        if (height > availableHeight) {

            height =
                availableHeight;

            width =
                height * ratio;
        }

        /*
         * حماية إضافية
         */
        width =
            Math.min(
                width,
                availableWidth
            );

        height =
            Math.min(
                height,
                availableHeight
            );

        /*
         * تقريب للأسفل لمنع كسر البكسل
         */
        width =
            Math.max(
                1,
                Math.floor(width)
            );

        height =
            Math.max(
                1,
                Math.floor(height)
            );

        player.style.width =
            width + "px";

        player.style.height =
            height + "px";
    }


    /*
     * أول حساب بعد تحميل الصفحة
     */
    resizePlayer();


    /*
     * مراقبة حجم WebView الحقيقي
     */
    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(function () {
                resizePlayer();
            });

        observer.observe(stage);
    }


    /*
     * تغيير حجم النافذة
     */
    window.addEventListener(
        "resize",
        resizePlayer,
        { passive: true }
    );


    /*
     * تغيير الاتجاه
     */
    window.addEventListener(
        "orientationchange",
        function () {

            /*
             * بعض أجهزة Android تحتاج أكثر من محاولة
             */
            setTimeout(resizePlayer, 100);
            setTimeout(resizePlayer, 400);
            setTimeout(resizePlayer, 800);

        },
        { passive: true }
    );


    /*
     * visualViewport
     */
    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            resizePlayer,
            { passive: true }
        );

        window.visualViewport.addEventListener(
            "scroll",
            resizePlayer,
            { passive: true }
        );
    }


    /*
     * إعادة الحساب بعد تحميل iframe
     */
    player.addEventListener(
        "load",
        function () {

            setTimeout(resizePlayer, 100);
            setTimeout(resizePlayer, 500);

        }
    );


    /*
     * منع Popups من صفحة الوسيط
     */
    window.open = function () {
        return null;
    };


    /*
     * منع فتح تبويبات جديدة
     */
    document.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest &&
                event.target.closest("a");

            if (!link) return;

            if (link.target === "_blank") {

                event.preventDefault();
                event.stopImmediatePropagation();
            }

        },
        true
    );

})();
</script>

</body>
</html>
