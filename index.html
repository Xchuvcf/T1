<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Video Player</title>

<style>
/* ==============================
   RESET
   ============================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}


/* ==============================
   منطقة المشغل
   ============================== */

#stage {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    /*
       أهم تعديل:
       نترك مساحة صغيرة جدًا في الأسفل
       لمنع خروج أي جزء من المشغل.
    */
    bottom: 4px;

    width: 100%;

    overflow: hidden;

    background: #000;
}


/* ==============================
   iframe
   ============================== */

#player {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    max-width: none;
    max-height: none;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    background: #000;
}
</style>
</head>


<body>

<div id="stage">

    <iframe
        id="player"
        title="Video Player"

        allow="autoplay; encrypted-media; picture-in-picture"

        scrolling="no"

        referrerpolicy="no-referrer">
    </iframe>

</div>


<script>

(function () {

    "use strict";


    /* =========================================
       الإعدادات
       ========================================= */

    const CONFIG = {

        /*
         * ملف البثوث
         */
        streamsFile: "streams.json",

        /*
         * مشغل YasirTV
         */
        playerHost:
            "https://912acsss8af382.yasirtv.com"

    };


    /* =========================================
       العناصر
       ========================================= */

    const stage =
        document.getElementById("stage");

    const player =
        document.getElementById("player");


    /* =========================================
       قراءة ?stream=
       ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* =========================================
       التحقق من المفتاح
       ========================================= */

    function validKey(key) {

        return (
            typeof key === "string" &&
            /^[A-Za-z0-9_-]+$/.test(key)
        );

    }


    /* =========================================
       تحميل streams.json
       ========================================= */

    async function loadStream() {

        try {

            if (!validKey(streamKey)) {

                throw new Error(
                    "Invalid stream key"
                );

            }


            const response =
                await fetch(
                    CONFIG.streamsFile +
                    "?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load streams.json"
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                !data.streams ||
                !data.streams[streamKey]
            ) {

                throw new Error(
                    "Stream not found"
                );

            }


            const stream =
                data.streams[streamKey];


            /* =====================================
               التحقق من Match ID
               ===================================== */

            if (
                typeof stream.match !== "string" ||
                !/^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {

                throw new Error(
                    "Invalid match ID"
                );

            }


            /* =====================================
               إنشاء رابط YasirTV
               ===================================== */

            const playerURL =
                CONFIG.playerHost +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    stream.match
                );


            /* =====================================
               تشغيل البث
               ===================================== */

            player.src = playerURL;


        } catch (error) {

            console.error(
                "Player error:",
                error
            );

            /*
             * لا نعرض معلومات داخلية للمستخدم
             */

            player.removeAttribute(
                "src"
            );

        }

    }


    /* =========================================
       ضبط الحجم
       ========================================= */

    function resizePlayer() {

        /*
         * لا نستخدم 16:9 هنا.
         *
         * السبب:
         * الـiframe الخارجي يجب أن يتبع
         * المساحة التي يعطيها WebView
         * بدل فرض أبعاد على المشغل الداخلي.
         */


        const width =
            Math.max(
                1,
                document.documentElement.clientWidth
            );


        const height =
            Math.max(
                1,
                document.documentElement.clientHeight
            );


        /*
         * المرحلة نفسها تحدد الحجم.
         */

        stage.style.width =
            width + "px";


        stage.style.height =
            Math.max(
                1,
                height - 4
            ) + "px";


        /*
         * iframe يأخذ المرحلة كاملة.
         */

        player.style.width =
            "100%";

        player.style.height =
            "100%";

    }


    /* =========================================
       ResizeObserver
       ========================================= */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    resizePlayer();

                }
            );

        observer.observe(
            document.documentElement
        );

    }


    /* =========================================
       تغيير حجم الشاشة
       ========================================= */

    window.addEventListener(
        "resize",
        function () {

            resizePlayer();

        },
        {
            passive: true
        }
    );


    /* =========================================
       تغيير الاتجاه
       ========================================= */

    window.addEventListener(
        "orientationchange",
        function () {

            /*
             * WebView يحتاج وقتًا بسيطًا
             * حتى يحصل على الحجم الجديد.
             */

            setTimeout(
                resizePlayer,
                50
            );

            setTimeout(
                resizePlayer,
                200
            );

            setTimeout(
                resizePlayer,
                500
            );

            setTimeout(
                resizePlayer,
                1000
            );

        },
        {
            passive: true
        }
    );


    /* =========================================
       visualViewport
       ========================================= */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            function () {

                resizePlayer();

            },
            {
                passive: true
            }
        );

    }


    /* =========================================
       بعد تحميل iframe
       ========================================= */

    player.addEventListener(
        "load",
        function () {

            setTimeout(
                resizePlayer,
                100
            );

            setTimeout(
                resizePlayer,
                400
            );

        }
    );


    /* =========================================
       منع فتح نافذة من الصفحة الخارجية
       ========================================= */

    window.open =
        function () {

            return null;

        };


    /* =========================================
       منع روابط _blank في صفحتنا
       ========================================= */

    document.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest &&
                event.target.closest("a");


            if (!link) {

                return;

            }


            if (
                link.target === "_blank" ||
                link.target === "_new"
            ) {

                event.preventDefault();

                event.stopImmediatePropagation();

            }

        },
        true
    );


    /* =========================================
       البداية
       ========================================= */

    resizePlayer();

    loadStream();


})();

</script>

</body>
</html>
