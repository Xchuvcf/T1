<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Player</title>
  <style>
    :root { --base-w: 640px; --base-h: 360px; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    #frameBox {
      position: relative;
      width: var(--base-w);
      height: var(--base-h);
      flex: 0 0 auto;
      transform-origin: center center;
      will-change: transform;
      background: #000;
    }
    #playerFrame {
      position: absolute;
      inset: 0;
      width: 640px;
      height: 360px;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <main id="stage">
    <div id="frameBox">
      <iframe
        id="playerFrame"
        title="Video player"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen="true"
        scrolling="no"
        referrerpolicy="no-referrer">
      </iframe>
    </div>
  </main>

  <script>
  (() => {
    const params = new URLSearchParams(location.search);
    const match = params.get('match') || '4828487';
    const frame = document.getElementById('playerFrame');
    const box = document.getElementById('frameBox');

    // Only the match id is accepted; the upstream host stays fixed.
    if (!/^[A-Za-z0-9_-]+$/.test(match)) {
      document.body.textContent = 'Invalid match';
      return;
    }

    frame.src =
      'https://912acsss8af382.yasirtv.com/playerv5.php?match=' +
      encodeURIComponent(match);

    function resize() {
      const w = Math.max(1, document.documentElement.clientWidth);
      const h = Math.max(1, document.documentElement.clientHeight);

      // Preserve the upstream player's exact 16:9 viewport.
      // Scale the entire iframe only when the host window is smaller.
      const scale = Math.min(1, w / 640, h / 360);
      box.style.transform = `scale(${scale})`;
    }

    const ro = new ResizeObserver(resize);
    ro.observe(document.documentElement);
    window.addEventListener('resize', resize, {passive: true});
    window.addEventListener('orientationchange', () => setTimeout(resize, 150), {passive: true});
    resize();

    // Protect the wrapper page from top-level popups/navigation.
    const realOpen = window.open;
    window.open = () => null;

    document.addEventListener('click', e => {
      const a = e.target.closest?.('a');
      if (a && a.target === '_blank') {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }, true);

    // Do not attempt to inspect/manipulate the cross-origin player.
    // Same-origin policy intentionally keeps the upstream player isolated.
  })();
  </script>
</body>
</html>
