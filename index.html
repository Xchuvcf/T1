<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Player</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    overflow: hidden;
}

/* الحاوية */
.player-container {
    width: 640px;
    height: 360px;

    position: fixed;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
}

/* المشغل */
.player-container iframe {
    display: block;

    width: 640px;
    height: 360px;

    border: 0;
    margin: 0;
    padding: 0;
}
    
/* الهاتف */
@media (max-width: 700px) {
    .player-container {
        width: 100vw;
        height: 56.25vw;

        max-width: 640px;
        max-height: 360px;
    }

    .player-container iframe {
        width: 100%;
        height: 100%;
    }
}
</style>
</head>

<body>

<div class="player-container">

    <iframe
        src="https://912acsss8af382.yasirtv.com/playerv5.php?match=4828487"
        frameborder="0"
        allowfullscreen
        scrolling="no"
        referrerpolicy="no-referrer">
    </iframe>

</div>

<script>
"use strict";

/* منع النوافذ المنبثقة من الصفحة الخارجية */
window.open = function () {
    return null;
};

/* منع فتح تبويبات جديدة من الصفحة */
document.addEventListener("click", function (event) {
    const link = event.target.closest("a");

    if (link && link.target === "_blank") {
        event.preventDefault();
        event.stopImmediatePropagation();
    }
}, true);
</script>

</body>
</html>
