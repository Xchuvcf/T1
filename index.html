<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Stream Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;
}

#app {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;
    overflow: hidden;
}


/* ==========================================
   مساحة المشغل
   ========================================== */

#playerBox {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform: translate(-50%, -50%);

    background: #000;
    overflow: hidden;
}


/* ==========================================
   iframe
   ========================================== */

#player {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    background: #000;
}
</style>
</head>


<body>

<div id="app">

    <div id="playerBox">

        <iframe
            id="player"

            title="Stream Player"

            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "

            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen

            scrolling="no"
            frameborder="0"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>

(function () {

    "use strict";


    /* ==========================================
       الإعدادات
       ========================================== */

    const CONFIG = {

        streamsFile: "streams.json",

        /*
         * true =
         * محاولة جعل محتوى الصفحة أفقيًا
         * إذا كانت مساحة WebView طولية.
         */
        virtualLandscape: true

    };


    /* ==========================================
       العناصر
       ========================================== */

    const app =
        document.getElementById("app");

    const playerBox =
        document.getElementById("playerBox");

    const player =
        document.getElementById("player");


    /* ==========================================
       قراءة ?stream=CH1
       ========================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* ==========================================
       التحقق من اسم القناة
       ========================================== */

    function isValidKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(value)
        );

    }


    /* ==========================================
       ضبط حجم الصفحة
       ========================================== */

    function resizePlayer() {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {
            return;
        }


        /*
         * إذا كانت الشاشة أفقية:
         * استخدم المساحة كاملة.
         */

        if (width >= height) {

            playerBox.style.width =
                width + "px";

            playerBox.style.height =
                height + "px";

            playerBox.style.transform =
                "translate(-50%, -50%)";

            return;
        }


        /*
         * إذا كانت الشاشة طولية:
         *
         * لا ندور الهاتف.
         *
         * ندور محتوى الصفحة فقط.
         *
         * بعد التدوير:
         *
         * العرض = ارتفاع WebView
         * الارتفاع = عرض WebView
         */

        if (CONFIG.virtualLandscape) {

            playerBox.style.width =
                height + "px";

            playerBox.style.height =
                width + "px";

            playerBox.style.transform =
                "translate(-50%, -50%) rotate(90deg)";

        } else {

            playerBox.style.width =
                width + "px";

            playerBox.style.height =
                height + "px";

            playerBox.style.transform =
                "translate(-50%, -50%)";

        }

    }


    /* ==========================================
       التحقق من رابط خارجي
       ========================================== */

    function isValidURL(value) {

        try {

            const url =
                new URL(value);

            return (
                url.protocol === "https:" ||
                url.protocol === "http:"
            );

        } catch {

            return false;

        }

    }


    /* ==========================================
       تحميل القناة
       ========================================== */

    async function loadStream() {

        try {

            if (!isValidKey(streamKey)) {

                throw new Error(
                    "اسم القناة غير صالح"
                );

            }


            const response =
                await fetch(
                    CONFIG.streamsFile +
                    "?v=" +
                    Date.now(),
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "تعذر تحميل streams.json"
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                typeof data.streams !== "object"
            ) {

                throw new Error(
                    "صيغة streams.json غير صحيحة"
                );

            }


            const stream =
                data.streams[streamKey];


            if (!stream) {

                throw new Error(
                    "القناة غير موجودة: " +
                    streamKey
                );

            }


            /*
             * =====================================
             * الطريقة الجديدة:
             *
             * CH1 → url
             * CH2 → url
             * =====================================
             */

            if (
                typeof stream.url === "string" &&
                isValidURL(stream.url)
            ) {

                player.src = stream.url;

                return;
            }


            /*
             * =====================================
             * دعم النظام القديم:
             *
             * إذا كان عندك match بدل url
             *
             * =====================================
             */

            if (
                typeof stream.match === "string" &&
                /^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {

                player.src =
                    "https://912acsss8af382.yasirtv.com" +
                    "/playerv5.php?match=" +
                    encodeURIComponent(
                        stream.match
                    );

                return;
            }


            throw new Error(
                "القناة لا تحتوي على url صالح"
            );


        } catch (error) {

            console.error(
                "Stream Player Error:",
                error
            );

            player.removeAttribute("src");

        }

    }


    /* ==========================================
       منع مشاكل المقاس
       ========================================== */

    function refresh() {

        requestAnimationFrame(
            function () {

                resizePlayer();

            }
        );

    }


    /* ==========================================
       البداية
       ========================================== */

    refresh();

    loadStream();


    /* ==========================================
       تغيير الحجم
       ========================================== */

    window.addEventListener(
        "resize",
        refresh,
        {
            passive: true
        }
    );


    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(refresh, 50);
            setTimeout(refresh, 200);
            setTimeout(refresh, 500);

        },
        {
            passive: true
        }
    );


    /* ==========================================
       Android WebView
       ========================================== */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            refresh,
            {
                passive: true
            }
        );

    }


    /* ==========================================
       مراقبة WebView
       ========================================== */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    refresh();

                }
            );

        observer.observe(app);

    }

})();
</script>

</body>
</html>
