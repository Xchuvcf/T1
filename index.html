<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر - خالي من الإعلانات</title>
    
    <!-- استدعاء مشغل Clappr لتشغيل البث -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        /* تصفير الهوامش وجعل الخلفية سوداء بالكامل */
        body, html {
            margin: 0;
            padding: 0;
            background: #0c0c0c;
            height: 100%;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            overflow: hidden;
        }
        
        /* حاوية الفيديو المخفية افتراضياً حتى يجهز البث */
        #player-container {
            width: 100%;
            height: 100%;
            display: none;
        }
        
        /* تصميم شاشة التحميل الاحترافية */
        #loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #e50914;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .error-text {
            color: #e50914;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل الأولية -->
    <div id="loading-screen">
        <div class="loader" id="spinner"></div>
        <h3 id="status-text">جاري استخراج رابط البث النقي... الرجاء الانتظار (قد يستغرق 10 ثوانٍ)</h3>
    </div>

    <!-- حاوية مشغل الفيديو -->
    <div id="player-container"></div>

    <script>
        // الرابط الداخلي لـ Vercel Serverless Function الذي أنشأناه
        const apiUrl = "/api/extract"; 
        // رابط البث المستهدف
        const targetStream = "https://daddylive.app/player/embed.php?id=91";

        async function fetchCleanStream() {
            try {
                // طلب استخراج البث من الخادم الخلفي (Vercel)
                const response = await fetch(`${apiUrl}?url=${encodeURIComponent(targetStream)}`);
                const data = await response.json();
                
                if (data.success && data.stream) {
                    // نجاح الاستخراج: إخفاء شاشة التحميل وإظهار المشغل
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('player-container').style.display = 'block';
                    
                    // تشغيل الفيديو عبر Clappr
                    var player = new Clappr.Player({
                        source: data.stream,
                        parentId: "#player-container",
                        width: '100%',
                        height: '100%',
                        autoPlay: true,
                        mimeType: "application/vnd.apple.mpegurl"
                    });
                } else {
                    // فشل العثور على الرابط
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('status-text').innerHTML = `<span class="error-text">فشل الاستخراج: ${data.error || 'لم يتم العثور على الرابط'}</span>`;
                }
            } catch (err) {
                // فشل الاتصال بدالة Vercel من الأساس
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status-text').innerHTML = '<span class="error-text">حدث خطأ في الاتصال بالسيرفر الداخلي. تأكد من رفع مجلد api بشكل صحيح.</span>';
            }
        }

        // تشغيل العملية فور فتح الصفحة
        fetchCleanStream();
    </script>

</body>
</html>
