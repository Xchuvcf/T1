<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Video Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    overscroll-behavior: none;
}

/* المساحة الآمنة */
#stage {
    position: fixed;

    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;
}

/* حاوية المشغل */
#playerBox {

    position: relative;

    width: 1px;
    height: 1px;

    overflow: hidden;

    background: #000;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;
}

/* iframe */
#player {

    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    flex: 0 0 auto;
}

</style>
</head>

<body>

<div id="stage">

    <div id="playerBox">

        <iframe
            id="player"

            title="Video Player"

            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"

            allowfullscreen
            webkitallowfullscreen="true"

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>

(function () {

"use strict";


/* =====================================================
   الإعدادات
   ===================================================== */

const CONFIG = {

    streamsFile: "streams.json",

    playerHost:
        "https://912acsss8af382.yasirtv.com",

    ratio: 16 / 9,

    /*
     * هامش أمان
     */
    safety: 0.96

};


/* =====================================================
   العناصر
   ===================================================== */

const stage =
    document.getElementById("stage");

const box =
    document.getElementById("playerBox");

const player =
    document.getElementById("player");


/* =====================================================
   قراءة stream
   ===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const streamKey =
    params.get("stream");


/* =====================================================
   التحقق
   ===================================================== */

function validKey(key) {

    return (
        typeof key === "string" &&
        /^[A-Za-z0-9_-]+$/.test(key)
    );

}


/* =====================================================
   تحميل streams.json
   ===================================================== */

async function loadStream() {

    try {

        if (!validKey(streamKey)) {

            throw new Error(
                "Invalid stream"
            );

        }


        const response =
            await fetch(
                CONFIG.streamsFile,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "streams.json unavailable"
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !data.streams ||
            !data.streams[streamKey]
        ) {

            throw new Error(
                "Stream not found"
            );

        }


        const stream =
            data.streams[streamKey];


        if (
            typeof stream.match !== "string" ||
            !/^[A-Za-z0-9_-]+$/.test(
                stream.match
            )
        ) {

            throw new Error(
                "Invalid match"
            );

        }


        /*
         * إنشاء الرابط
         */

        player.src =
            CONFIG.playerHost +
            "/playerv5.php?match=" +
            encodeURIComponent(
                stream.match
            );


    } catch (error) {

        console.error(error);

        document.body.innerHTML = "";

    }

}


/* =====================================================
   حجم الشاشة الحقيقي
   ===================================================== */

function getViewport() {

    let width =
        document.documentElement.clientWidth;

    let height =
        document.documentElement.clientHeight;


    /*
     * visualViewport
     */

    if (window.visualViewport) {

        if (
            window.visualViewport.width > 0
        ) {

            width =
                Math.min(
                    width,
                    window.visualViewport.width
                );

        }


        if (
            window.visualViewport.height > 0
        ) {

            height =
                Math.min(
                    height,
                    window.visualViewport.height
                );

        }

    }


    return {

        width:
            Math.max(1, width),

        height:
            Math.max(1, height)

    };

}


/* =====================================================
   ضبط الحجم
   ===================================================== */

function resizePlayer() {

    const viewport =
        getViewport();


    const stageWidth =
        stage.clientWidth ||
        viewport.width;

    const stageHeight =
        stage.clientHeight ||
        viewport.height;


    /*
     * Safe margin
     */

    const availableWidth =
        stageWidth *
        CONFIG.safety;

    const availableHeight =
        stageHeight *
        CONFIG.safety;


    /*
     * 16:9
     */

    let width =
        availableWidth;

    let height =
        width /
        CONFIG.ratio;


    /*
     * إذا كان الارتفاع أكبر
     */

    if (
        height >
        availableHeight
    ) {

        height =
            availableHeight;

        width =
            height *
            CONFIG.ratio;

    }


    /*
     * حماية إضافية
     */

    width =
        Math.min(
            width,
            availableWidth
        );

    height =
        Math.min(
            height,
            availableHeight
        );


    /*
     * تقريب للأسفل
     */

    width =
        Math.floor(width);

    height =
        Math.floor(height);


    /*
     * منع الحجم السالب
     */

    width =
        Math.max(1, width);

    height =
        Math.max(1, height);


    /*
     * تطبيق الحجم
     */

    box.style.width =
        width + "px";

    box.style.height =
        height + "px";


    player.style.width =
        width + "px";

    player.style.height =
        height + "px";

}


/* =====================================================
   ResizeObserver
   ===================================================== */

if (window.ResizeObserver) {

    const observer =
        new ResizeObserver(
            function () {

                resizePlayer();

            }
        );

    observer.observe(stage);

}


/* =====================================================
   Resize
   ===================================================== */

window.addEventListener(
    "resize",
    resizePlayer,
    {
        passive: true
    }
);


/* =====================================================
   Orientation
   ===================================================== */

window.addEventListener(
    "orientationchange",
    function () {

        setTimeout(
            resizePlayer,
            100
        );

        setTimeout(
            resizePlayer,
            400
        );

        setTimeout(
            resizePlayer,
            800
        );

    },
    {
        passive: true
    }
);


/* =====================================================
   visualViewport
   ===================================================== */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );

}


/* =====================================================
   تحميل iframe
   ===================================================== */

player.addEventListener(
    "load",
    function () {

        setTimeout(
            resizePlayer,
            100
        );

        setTimeout(
            resizePlayer,
            500
        );

    }
);


/* =====================================================
   البداية
   ===================================================== */

resizePlayer();

loadStream();


})();

</script>

</body>
</html>
