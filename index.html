<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Stream Player</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    position: fixed;

    inset: 0;
}


/* =====================================================
   الصفحة الأساسية
   ===================================================== */

#root {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   الحاوية الأفقية
   ===================================================== */

#landscapePage {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 100vw;
    height: 100vh;

    transform: translate(-50%, -50%);

    transform-origin: center center;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   Web Player
   ===================================================== */

#playerFrame {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   الوضع الطولي:
   نقوم بتدوير محتوى الصفحة فقط
   وليس الهاتف
   ===================================================== */

@media (orientation: portrait) {

    #landscapePage {

        width: 100vh;
        height: 100vw;

        width: 100dvh;
        height: 100dvw;

        transform:
            translate(-50%, -50%)
            rotate(90deg);

    }

}


/* =====================================================
   الوضع الأفقي:
   بدون تدوير
   ===================================================== */

@media (orientation: landscape) {

    #landscapePage {

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

        transform:
            translate(-50%, -50%);

    }

}

</style>

</head>


<body>

<div id="root">

    <div id="landscapePage">

        <iframe
            id="playerFrame"

            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "

            allowfullscreen

            webkitallowfullscreen

            mozallowfullscreen

            scrolling="no"

            frameborder="0"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>

/* =====================================================
   إعدادات
   ===================================================== */

const STREAMS_FILE = "streams.json";

const PLAYER_HOST =
    "https://912acsss8af382.yasirtv.com";


const iframe =
    document.getElementById("playerFrame");

const page =
    document.getElementById("landscapePage");


/* =====================================================
   قراءة stream
   ===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const streamKey =
    params.get("stream");


/* =====================================================
   التحقق من ID
   ===================================================== */

function isValidKey(value) {

    return (
        typeof value === "string" &&
        /^[A-Za-z0-9_-]+$/.test(value)
    );

}


/* =====================================================
   ضبط الصفحة
   ===================================================== */

function resizePage() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    if (!width || !height) {
        return;
    }


    /*
     * الصفحة الطولية:
     * ندور المحتوى فقط.
     */

    if (height > width) {

        page.style.width =
            height + "px";

        page.style.height =
            width + "px";

        page.style.transform =
            "translate(-50%, -50%) rotate(90deg)";

    }

    /*
     * الصفحة الأفقية:
     * لا يوجد تدوير.
     */

    else {

        page.style.width =
            width + "px";

        page.style.height =
            height + "px";

        page.style.transform =
            "translate(-50%, -50%)";

    }

}


/* =====================================================
   تحميل البث
   ===================================================== */

async function loadStream() {

    try {

        if (!isValidKey(streamKey)) {

            throw new Error(
                "Invalid stream ID"
            );

        }


        const response =
            await fetch(
                STREAMS_FILE +
                "?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Cannot load streams.json"
            );

        }


        const data =
            await response.json();


        const stream =
            data &&
            data.streams &&
            data.streams[streamKey];


        if (!stream) {

            throw new Error(
                "Stream not found: " +
                streamKey
            );

        }


        const match =
            String(stream.match || "");


        if (
            !/^[A-Za-z0-9_-]+$/.test(match)
        ) {

            throw new Error(
                "Invalid match ID"
            );

        }


        /*
         * رابط المشغل الأصلي
         */

        iframe.src =
            PLAYER_HOST +
            "/playerv5.php?match=" +
            encodeURIComponent(match);


    } catch (error) {

        console.error(
            "Stream Player:",
            error
        );

    }

}


/* =====================================================
   تهيئة
   ===================================================== */

resizePage();

loadStream();


/* =====================================================
   مراقبة تغيير حجم WebView
   ===================================================== */

window.addEventListener(
    "resize",
    resizePage,
    {
        passive: true
    }
);


window.addEventListener(
    "orientationchange",
    function () {

        setTimeout(resizePage, 50);
        setTimeout(resizePage, 200);
        setTimeout(resizePage, 500);

    },
    {
        passive: true
    }
);


/* =====================================================
   visualViewport
   مهم جدًا داخل Android WebView
   ===================================================== */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizePage,
        {
            passive: true
        }
    );

}


/* =====================================================
   ResizeObserver
   ===================================================== */

if (window.ResizeObserver) {

    const observer =
        new ResizeObserver(
            function () {
                resizePage();
            }
        );

    observer.observe(
        document.documentElement
    );

}

</script>

</body>
</html>
