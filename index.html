<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>البث المباشر النقي</title>
    <!-- استدعاء مشغل الفيديو -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // رابط الـ Worker الخاص بك + رابط البث المستهدف
        const workerUrl = "https://xmsb.danapana303.workers.dev/";
        const targetStream = "https://daddylive.app/player/embed.php?id=91";
        
        // بناء الرابط النهائي
        const finalUrl = workerUrl + "?url=" + encodeURIComponent(targetStream);

        // تشغيل الفيديو في موقعك مباشرة
        var player = new Clappr.Player({
            source: finalUrl,
            parentId: "#player",
            width: '100%',
            height: '100%',
            autoPlay: true,
            mute: false
        });
    </script>

</body>
</html>
