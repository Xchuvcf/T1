<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Player</title>

<style>

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    position: fixed;

    inset: 0;
}


/* =========================================
   الصفحة الرئيسية
   ========================================= */

#stage {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    overflow: hidden;

    background: #000;

    display: block;
}


/* =========================================
   المشغل
   ========================================= */

#player {

    position: absolute;

    /*
     * يأخذ المساحة كاملة
     */
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    max-width: none;
    max-height: none;

    border: 0;

    margin: 0;
    padding: 0;

    display: block;

    background: #000;

}

</style>

</head>


<body>


<div id="stage">

    <iframe
        id="player"

        title="Video Player"

        allow="
            autoplay;
            encrypted-media;
            picture-in-picture
        "

        scrolling="no"

        referrerpolicy="no-referrer">
    </iframe>

</div>


<script>

(function () {

    "use strict";


    /* =========================================
       الإعدادات
       ========================================= */

    const CONFIG = {

        streamsFile: "streams.json",

        playerHost:
            "https://912acsss8af382.yasirtv.com"

    };


    /* =========================================
       العناصر
       ========================================= */

    const player =
        document.getElementById("player");


    /* =========================================
       قراءة stream
       ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const streamKey =
        params.get("stream");


    /* =========================================
       التحقق
       ========================================= */

    function validKey(key) {

        return (
            typeof key === "string" &&
            /^[A-Za-z0-9_-]+$/.test(key)
        );

    }


    /* =========================================
       تحميل البث
       ========================================= */

    async function loadStream() {

        try {

            if (!validKey(streamKey)) {

                throw new Error(
                    "Invalid stream"
                );

            }


            const response =
                await fetch(
                    CONFIG.streamsFile +
                    "?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load streams"
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                !data.streams ||
                !data.streams[streamKey]
            ) {

                throw new Error(
                    "Stream not found"
                );

            }


            const stream =
                data.streams[streamKey];


            if (
                typeof stream.match !== "string" ||
                !/^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {

                throw new Error(
                    "Invalid match"
                );

            }


            /*
             * رابط YasirTV
             */

            const url =
                CONFIG.playerHost +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    stream.match
                );


            player.src = url;


        } catch (error) {

            console.error(error);

            /*
             * لا نعرض صفحة خطأ
             * حتى لا تؤثر على WebView
             */

            player.removeAttribute("src");

        }

    }


    /* =========================================
       تثبيت حجم الـiframe
       ========================================= */

    function updateSize() {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        /*
         * استخدام dvh/dvw عند توفرها
         */

        player.style.left = "0px";

        player.style.top = "0px";

        player.style.width =
            width + "px";

        player.style.height =
            height + "px";

    }


    /* =========================================
       البداية
       ========================================= */

    updateSize();

    loadStream();


    /* =========================================
       Resize
       ========================================= */

    window.addEventListener(
        "resize",
        function () {

            updateSize();

        },
        {
            passive: true
        }
    );


    /* =========================================
       Orientation
       ========================================= */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                updateSize,
                50
            );

            setTimeout(
                updateSize,
                250
            );

            setTimeout(
                updateSize,
                600
            );

        },
        {
            passive: true
        }
    );


    /* =========================================
       visualViewport
       ========================================= */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            updateSize,
            {
                passive: true
            }
        );

    }


    /* =========================================
       منع Popups من صفحتنا
       ========================================= */

    const originalOpen =
        window.open;

    window.open =
        function () {

            return null;

        };


})();

</script>

</body>
</html>
