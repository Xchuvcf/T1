<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Stream Player</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   التطبيق
   ===================================================== */

#app {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   حاوية المشغل
   ===================================================== */

#playerContainer {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =====================================================
   أي iframe يتم إنشاؤه
   ===================================================== */

#playerContainer iframe {

    display: block;

    width: 100% !important;
    height: 100% !important;

    max-width: none !important;
    max-height: none !important;

    margin: 0 !important;
    padding: 0 !important;

    border: 0 !important;

    background: #000;

    flex: 0 0 auto;
}


/* =====================================================
   رسالة الخطأ
   ===================================================== */

#error {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    color: #fff;

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size: 15px;

    line-height: 1.6;

    display: none;

    z-index: 100;
}

</style>

</head>


<body>

<div id="app">

    <div id="playerContainer"></div>

    <div id="error"></div>

</div>


<script>

(function () {

    "use strict";


    /* =================================================
       🛡️ AD BLOCKER — الحماية من الإعلانات

       يعمل على مستويين:

       1) الصفحة الرئيسية (هذا الملف):
          - منع أي نافذة منبثقة (popup / popunder)
          - منع أي محاولة تحويل (redirect) للصفحة كاملة
          - إزالة أي عنصر دخيل يُحقن مباشرة في <body>
            (مثل لافتات أو أزرار وهمية)

       2) الـ iframe (المشغل الخارجي):
          - نستخدم خاصية sandbox لمنع الإعلان من:
            فتح نوافذ جديدة، تحويل الصفحة بالكامل،
            فتح نوافذ تنبيه (alert/confirm)، أو تحميل ملفات تلقائيًا.

       ⚠️ ملاحظة مهمة وصادقة:
       لا يمكن لأي كود جافاسكريبت في صفحتك أن يدخل إلى
       داخل محتوى iframe خارجي (من نطاق مختلف) ويحذف
       الإعلانات المرسومة بصريًا بداخله — هذا تمنعه
       المتصفحات نفسها لأسباب أمنية (Same-Origin Policy)،
       وليس قصورًا في هذا الكود. ما يمكن فعله فعليًا
       (وهو الأهم عمليًا) هو منع الإعلان من "الهروب" خارج
       مشغله عبر نافذة منبثقة أو تحويل كامل للصفحة —
       وهذا ما يفعله هذا الكود.
       ================================================= */

    (function adBlocker() {

        /* -----------------------------------------------
           1) منع كل النوافذ المنبثقة نهائيًا
           ----------------------------------------------- */

        const blockedOpen = function () {
            console.warn("AdBlocker: تم منع نافذة منبثقة");
            return null;
        };

        try {
            Object.defineProperty(window, "open", {
                configurable: false,
                writable: false,
                value: blockedOpen
            });
        } catch (e) {
            window.open = blockedOpen;
        }


        /* -----------------------------------------------
           2) منع تحويل الصفحة الكامل (Popunder Redirect)
              عبر أزرار وهمية أو نقرات خفية فوق المشغل
           ----------------------------------------------- */

        document.addEventListener(
            "click",
            function (event) {

                const target = event.target;

                if (!target || !target.closest) {
                    return;
                }

                const link = target.closest("a[target='_blank']");

                if (link && !container.contains(link)) {

                    event.preventDefault();
                    event.stopPropagation();

                    console.warn(
                        "AdBlocker: تم منع فتح رابط خارجي مشبوه"
                    );

                }

            },
            true
        );


        /* -----------------------------------------------
           3) منع فتح نوافذ منبثقة عبر الضغط الوسطي
              (Middle Click) على روابط
           ----------------------------------------------- */

        document.addEventListener(
            "auxclick",
            function (event) {

                if (event.button === 1) {

                    const target = event.target;

                    if (target && target.closest &&
                        target.closest("a")) {

                        event.preventDefault();
                        event.stopPropagation();

                    }

                }

            },
            true
        );


        /* -----------------------------------------------
           4) إزالة أي عنصر يُحقن مباشرة في body
              (خارج #app) — لافتات، أزرار وهمية،
              طبقات إعلانية كاملة الشاشة
           ----------------------------------------------- */

        const appRoot =
            document.getElementById("app");

        const bodyGuard = new MutationObserver(function (mutations) {

            mutations.forEach(function (mutation) {

                mutation.addedNodes.forEach(function (node) {

                    if (
                        node.nodeType === 1 &&
                        node !== appRoot &&
                        node.id !== "app"
                    ) {

                        console.warn(
                            "AdBlocker: تمت إزالة عنصر دخيل:",
                            node
                        );

                        node.remove();

                    }

                });

            });

        });

        bodyGuard.observe(document.body, {
            childList: true
        });


        /* -----------------------------------------------
           5) منع فتح نوافذ alert / confirm / prompt
              المزعجة التي تستخدمها بعض الإعلانات
           ----------------------------------------------- */

        window.alert = function () {
            console.warn("AdBlocker: تم منع نافذة alert");
        };

        window.confirm = function () {
            console.warn("AdBlocker: تم منع نافذة confirm");
            return false;
        };

        window.prompt = function () {
            console.warn("AdBlocker: تم منع نافذة prompt");
            return null;
        };

    })();


    /* =================================================
       ملفات الإعدادات
       ================================================= */

    const STREAMS_FILE =
        "streams.json";

    const IFRAMES_FILE =
        "iframes.json";


    /* =================================================
       العناصر
       ================================================= */

    const container =
        document.getElementById(
            "playerContainer"
        );

    const errorBox =
        document.getElementById(
            "error"
        );


    /* =================================================
       قراءة:

       ?stream=CH1
       ================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* =================================================
       التحقق من المفتاح
       ================================================= */

    function isValidKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(value)
        );

    }


    /* =================================================
       التحقق من URL
       ================================================= */

    function isValidURL(value) {

        try {

            const url =
                new URL(value);

            return (
                url.protocol === "https:" ||
                url.protocol === "http:"
            );

        } catch {

            return false;

        }

    }


    /* =================================================
       إظهار الخطأ
       ================================================= */

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    /* =================================================
       إخفاء الخطأ
       ================================================= */

    function hideError() {

        errorBox.textContent =
            "";

        errorBox.style.display =
            "none";

    }


    /* =================================================
       تحميل JSON
       ================================================= */

    async function loadJSON(file) {

        const response =
            await fetch(
                file +
                "?v=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "تعذر تحميل " + file
            );

        }


        return await response.json();

    }


    /* =================================================
       تنظيف iframe السابق
       ================================================= */

    function clearPlayer() {

        container.replaceChildren();

    }


    /* =================================================
       إعداد iframe
       ================================================= */

    function prepareIframe(iframe) {

        /*
         * نجعل iframe مناسبًا لمساحة WebView
         */

        iframe.style.width =
            "100%";

        iframe.style.height =
            "100%";

        iframe.style.border =
            "0";

        iframe.style.margin =
            "0";

        iframe.style.padding =
            "0";

        iframe.setAttribute(
            "scrolling",
            "no"
        );


        /*
         * Fullscreen
         */

        iframe.setAttribute(
            "allowfullscreen",
            ""
        );

        iframe.setAttribute(
            "webkitallowfullscreen",
            ""
        );

        iframe.setAttribute(
            "mozallowfullscreen",
            ""
        );


        /*
         * الصلاحيات
         */

        iframe.setAttribute(
            "allow",
            [
                "autoplay",
                "encrypted-media",
                "fullscreen",
                "picture-in-picture",
                "accelerometer",
                "clipboard-write",
                "gyroscope",
                "web-share"
            ].join("; ")
        );


        /*
         * منع ظهور scrollbars
         */

        iframe.style.overflow =
            "hidden";


        /*
         * 🛡️ الحماية الأهم: sandbox
         *
         * نسمح فقط بما يحتاجه المشغل (سكربتات + نفس المصدر
         * + نماذج + العرض بملء الشاشة)، ونمنع تمامًا:
         * - فتح نوافذ منبثقة (لا يوجد allow-popups)
         * - تحويل الصفحة بالكامل لرابط آخر (لا يوجد
         *   allow-top-navigation)
         * - نوافذ alert/confirm (لا يوجد allow-modals)
         * - التنزيل التلقائي للملفات (لا يوجد allow-downloads)
         *
         * هذا يوقف تقريبًا كل أشكال "اضغط في أي مكان
         * فيفتح إعلان" لأن المتصفح نفسه يمنعها قبل أن
         * تصل لأي مكان.
         */

        iframe.setAttribute(
            "sandbox",
            [
                "allow-scripts",
                "allow-same-origin",
                "allow-forms",
                "allow-presentation"
            ].join(" ")
        );

        iframe.setAttribute(
            "referrerpolicy",
            "no-referrer"
        );

    }


    /* =================================================
       تشغيل SRC
       ================================================= */

    /*
     * 🛡️ رابط بروكسي حجب الإعلانات (ad_proxy.php)
     *
     * غيّر هذا الرابط ليطابق مكان رفع ملف ad_proxy.php
     * على استضافتك، مثال:
     * "https://your-domain.com/ad_proxy.php"
     *
     * اتركه فارغًا "" لتعطيل البروكسي والرجوع للتحميل
     * المباشر (مع بقاء حماية sandbox فقط).
     */

    const AD_PROXY_URL = "https://msxc.unaux.com/ad_proxy.php";


    function buildStreamUrl(url) {

        if (!AD_PROXY_URL) {
            return url;
        }

        return AD_PROXY_URL +
            "?url=" +
            encodeURIComponent(url);

    }


    function createFromSrc(url) {

        if (!isValidURL(url)) {

            throw new Error(
                "رابط iframe غير صالح"
            );

        }


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            buildStreamUrl(url);


        iframe.title =
            "Stream Player";


        prepareIframe(iframe);


        container.appendChild(
            iframe
        );

    }


    /* =================================================
       تشغيل iframe كامل
       ================================================= */

    function createFromCode(code) {

        if (
            typeof code !== "string" ||
            !code.trim()
        ) {

            throw new Error(
                "كود iframe فارغ"
            );

        }


        /*
         * نحول النص إلى HTML
         */

        const template =
            document.createElement(
                "template"
            );


        template.innerHTML =
            code.trim();


        /*
         * نبحث عن iframe فقط
         */

        const iframe =
            template.content
                .querySelector(
                    "iframe"
                );


        if (!iframe) {

            throw new Error(
                "لم يتم العثور على iframe داخل الكود"
            );

        }


        /*
         * ننقله إلى الصفحة — عبر بروكسي حجب الإعلانات
         * (نفس المنطق المستخدم بـ createFromSrc)
         */

        const originalSrc =
            iframe.getAttribute("src");

        if (
            originalSrc &&
            isValidURL(originalSrc)
        ) {

            iframe.setAttribute(
                "src",
                buildStreamUrl(originalSrc)
            );

        }


        prepareIframe(iframe);


        container.appendChild(
            iframe
        );

    }


    /* =================================================
       تشغيل البث
       ================================================= */

    async function loadStream() {

        try {

            hideError();

            clearPlayer();


            /* -----------------------------------------
               التحقق من CH
               ----------------------------------------- */

            if (
                !isValidKey(streamKey)
            ) {

                throw new Error(
                    "استخدم رابطًا مثل ?stream=CH1"
                );

            }


            /* -----------------------------------------
               streams.json
               ----------------------------------------- */

            const streamsData =
                await loadJSON(
                    STREAMS_FILE
                );


            if (
                !streamsData ||
                typeof streamsData.streams !==
                    "object"
            ) {

                throw new Error(
                    "صيغة streams.json غير صحيحة"
                );

            }


            const stream =
                streamsData
                    .streams[streamKey];


            if (!stream) {

                throw new Error(
                    "القناة غير موجودة: " +
                    streamKey
                );

            }


            /* -----------------------------------------
               iframe ID
               ----------------------------------------- */

            const iframeKey =
                stream.iframe;


            if (
                !isValidKey(
                    iframeKey
                )
            ) {

                throw new Error(
                    "iframe غير محدد لهذه القناة"
                );

            }


            /* -----------------------------------------
               iframes.json
               ----------------------------------------- */

            const iframeData =
                await loadJSON(
                    IFRAMES_FILE
                );


            if (
                !iframeData ||
                typeof iframeData.iframes !==
                    "object"
            ) {

                throw new Error(
                    "صيغة iframes.json غير صحيحة"
                );

            }


            const config =
                iframeData
                    .iframes[iframeKey];


            if (!config) {

                throw new Error(
                    "المشغل غير موجود: " +
                    iframeKey
                );

            }


            /* -----------------------------------------
               تحديد نوع المصدر
               ----------------------------------------- */

            const type =
                String(
                    config.type || ""
                ).toLowerCase();


            /* -----------------------------------------
               النوع الأول:

               iframe كامل
               ----------------------------------------- */

            if (type === "iframe") {

                createFromCode(
                    config.code
                );

            }


            /* -----------------------------------------
               النوع الثاني:

               src فقط
               ----------------------------------------- */

            else if (type === "src") {

                createFromSrc(
                    config.url
                );

            }


            /* -----------------------------------------
               نوع غير معروف
               ----------------------------------------- */

            else {

                throw new Error(
                    "نوع iframe غير معروف"
                );

            }


            console.log(
                "Stream:",
                streamKey
            );

            console.log(
                "Iframe:",
                iframeKey
            );

            console.log(
                "Type:",
                type
            );


        } catch (error) {

            console.error(
                "Player Error:",
                error
            );


            clearPlayer();


            showError(
                error.message ||
                "تعذر تشغيل البث"
            );

        }

    }


    /* =================================================
       تحديث الحجم
       ================================================= */

    function resizePlayer() {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {

            return;

        }


        container.style.width =
            width + "px";

        container.style.height =
            height + "px";

    }


    /* =================================================
       البداية
       ================================================= */

    resizePlayer();

    loadStream();


    /* =================================================
       WebView Resize
       ================================================= */

    window.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );


    /* =================================================
       Orientation
       ================================================= */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                50
            );

            setTimeout(
                resizePlayer,
                200
            );

            setTimeout(
                resizePlayer,
                500
            );

        },
        {
            passive: true
        }
    );


    /* =================================================
       Android visualViewport
       ================================================= */

    if (window.visualViewport) {

        window.visualViewport
            .addEventListener(
                "resize",
                resizePlayer,
                {
                    passive: true
                }
            );

    }


    /* =================================================
       مراقبة حجم الصفحة
       ================================================= */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(
                function () {

                    resizePlayer();

                }
            );

        observer.observe(
            document.documentElement
        );

    }

})();

</script>

</body>
</html>
