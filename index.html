<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    overscroll-behavior: none;
}

/* المساحة الكاملة */
#stage {
    position: fixed;

    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);

    width: auto;
    height: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;
}

/* حاوية المشغل */
#playerBox {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;

    flex: 0 0 auto;
}

/* المشغل */
#player {
    display: block;

    width: 1px;
    height: 1px;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    flex: 0 0 auto;
}
</style>
</head>

<body>

<div id="stage">

    <div id="playerBox">

        <iframe
            id="player"
            title="Video Player"

            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "

            allowfullscreen
            webkitallowfullscreen="true"

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>

<script>
(function () {

    "use strict";


    /* =====================================================
       قراءة رقم المباراة
       ===================================================== */

    const params =
        new URLSearchParams(window.location.search);

    const match =
        params.get("match") || "4828487";


    /*
     * حماية قيمة match
     */

    if (!/^[A-Za-z0-9_-]+$/.test(match)) {

        document.body.innerHTML = "";

        return;
    }


    /* =====================================================
       العناصر
       ===================================================== */

    const stage =
        document.getElementById("stage");

    const box =
        document.getElementById("playerBox");

    const player =
        document.getElementById("player");


    /* =====================================================
       رابط المشغل
       ===================================================== */

    player.src =
        "https://912acsss8af382.yasirtv.com/playerv5.php?match=" +
        encodeURIComponent(match);


    /* =====================================================
       الحصول على حجم الشاشة الحقيقي
       ===================================================== */

    function getViewport() {

        let width =
            document.documentElement.clientWidth;

        let height =
            document.documentElement.clientHeight;


        /*
         * visualViewport أدق في Android
         */

        if (window.visualViewport) {

            const vw =
                window.visualViewport.width;

            const vh =
                window.visualViewport.height;


            if (vw > 0) {
                width = Math.min(width, vw);
            }

            if (vh > 0) {
                height = Math.min(height, vh);
            }
        }


        return {
            width: Math.max(1, width),
            height: Math.max(1, height)
        };
    }


    /* =====================================================
       ضبط حجم المشغل
       ===================================================== */

    function resizePlayer() {

        const viewport =
            getViewport();


        /*
         * مساحة الـstage الفعلية
         */

        const stageWidth =
            Math.min(
                viewport.width,
                stage.clientWidth || viewport.width
            );

        const stageHeight =
            Math.min(
                viewport.height,
                stage.clientHeight || viewport.height
            );


        /*
         * هامش أمان صغير
         *
         * يمنع خروج أي جزء خارج الشاشة.
         */

        const margin = 0.96;


        const availableWidth =
            stageWidth * margin;

        const availableHeight =
            stageHeight * margin;


        /*
         * النسبة الأصلية للمشغل
         *
         * 640 × 360
         */

        const ratio = 16 / 9;


        let width =
            availableWidth;

        let height =
            width / ratio;


        /*
         * إذا كان الارتفاع أكبر من المساحة
         * المتاحة، نضبط الحجم بناءً على الارتفاع.
         */

        if (height > availableHeight) {

            height =
                availableHeight;

            width =
                height * ratio;
        }


        /*
         * حماية إضافية
         */

        width =
            Math.min(
                width,
                availableWidth
            );

        height =
            Math.min(
                height,
                availableHeight
            );


        /*
         * التقريب للأسفل
         */

        width =
            Math.max(
                1,
                Math.floor(width)
            );

        height =
            Math.max(
                1,
                Math.floor(height)
            );


        /*
         * تطبيق الحجم
         */

        box.style.width =
            width + "px";

        box.style.height =
            height + "px";


        player.style.width =
            width + "px";

        player.style.height =
            height + "px";
    }


    /* =====================================================
       Fullscreen
       ===================================================== */

    async function enterFullscreen() {

        try {

            /*
             * إذا كان بالفعل Fullscreen
             */

            if (
                document.fullscreenElement ||
                document.webkitFullscreenElement
            ) {
                return;
            }


            /*
             * Fullscreen API
             */

            if (
                document.documentElement.requestFullscreen
            ) {

                await document.documentElement
                    .requestFullscreen({
                        navigationUI: "hide"
                    });

                return;
            }


            /*
             * دعم WebKit
             */

            if (
                document.documentElement
                    .webkitRequestFullscreen
            ) {

                document.documentElement
                    .webkitRequestFullscreen();

                return;
            }

        } catch (error) {

            /*
             * Android/Chrome قد يمنع
             * التشغيل التلقائي.
             */

            console.log(
                "Fullscreen request blocked"
            );
        }
    }


    /* =====================================================
       محاولة Fullscreen تلقائيًا
       ===================================================== */

    function tryAutoFullscreen() {

        /*
         * بعض المتصفحات لا تسمح بـFullscreen
         * إلا بعد تفاعل المستخدم.
         */

        enterFullscreen();

    }


    /* =====================================================
       Fullscreen عند أول تفاعل
       ===================================================== */

    function fullscreenOnInteraction() {

        enterFullscreen();

        document.removeEventListener(
            "touchstart",
            fullscreenOnInteraction
        );

        document.removeEventListener(
            "click",
            fullscreenOnInteraction
        );

    }


    document.addEventListener(
        "touchstart",
        fullscreenOnInteraction,
        {
            passive: true,
            once: true
        }
    );


    document.addEventListener(
        "click",
        fullscreenOnInteraction,
        {
            passive: true,
            once: true
        }
    );


    /* =====================================================
       بدء الصفحة
       ===================================================== */

    resizePlayer();


    /*
     * محاولة الدخول Fullscreen
     */

    setTimeout(
        tryAutoFullscreen,
        500
    );


    setTimeout(
        resizePlayer,
        100
    );

    setTimeout(
        resizePlayer,
        500
    );

    setTimeout(
        resizePlayer,
        1000
    );


    /* =====================================================
       مراقبة تغيير الحجم
       ===================================================== */

    if (window.ResizeObserver) {

        const observer =
            new ResizeObserver(function () {

                resizePlayer();

            });

        observer.observe(stage);
    }


    /* =====================================================
       resize
       ===================================================== */

    window.addEventListener(
        "resize",
        resizePlayer,
        {
            passive: true
        }
    );


    /* =====================================================
       تغيير الاتجاه
       ===================================================== */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                resizePlayer,
                100
            );

            setTimeout(
                resizePlayer,
                400
            );

            setTimeout(
                resizePlayer,
                800
            );

        },
        {
            passive: true
        }
    );


    /* =====================================================
       visualViewport
       ===================================================== */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            resizePlayer,
            {
                passive: true
            }
        );
    }


    /* =====================================================
       Fullscreen تغير
       ===================================================== */

    document.addEventListener(
        "fullscreenchange",
        function () {

            setTimeout(
                resizePlayer,
                100
            );

            setTimeout(
                resizePlayer,
                500
            );

        }
    );


    /* =====================================================
       تحميل iframe
       ===================================================== */

    player.addEventListener(
        "load",
        function () {

            setTimeout(
                resizePlayer,
                100
            );

            setTimeout(
                resizePlayer,
                500
            );

        }
    );


    /* =====================================================
       منع Popups في الصفحة الوسيطة
       ===================================================== */

    window.open = function () {

        return null;

    };


    /* =====================================================
       منع فتح تبويبات جديدة
       ===================================================== */

    document.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest &&
                event.target.closest("a");


            if (!link) {
                return;
            }


            if (
                link.target === "_blank" ||
                link.target === "_new"
            ) {

                event.preventDefault();

                event.stopImmediatePropagation();

            }

        },
        true
    );


})();
</script>

</body>
</html>
