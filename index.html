<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Player</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/*
   الحجم الأصلي لمشغل YasirTV
   640 × 360
*/
.player-wrapper {
    position: absolute;

    width: 640px;
    height: 360px;

    left: 50%;
    top: 50%;

    transform-origin: center center;
}

.player-wrapper iframe {
    display: block;

    width: 640px;
    height: 360px;

    border: 0;
    margin: 0;
    padding: 0;
}
</style>
</head>

<body>

<div class="player-wrapper" id="player">

    <iframe
        src="https://912acsss8af382.yasirtv.com/playerv5.php?match=4828487"
        frameborder="0"
        allowfullscreen
        scrolling="no"
        referrerpolicy="no-referrer">
    </iframe>

</div>

<script>

const player = document.getElementById("player");

function resizePlayer() {

    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    /*
       الحجم الأصلي
    */
    const originalWidth = 640;
    const originalHeight = 360;

    /*
       نحسب أفضل Scale بدون تشويه
    */
    const scaleX = viewportWidth / originalWidth;
    const scaleY = viewportHeight / originalHeight;

    const scale = Math.min(scaleX, scaleY);

    /*
       تكبير/تصغير المشغل بالكامل
    */
    player.style.transform =
        `translate(-50%, -50%) scale(${scale})`;
}

/*
   عند فتح الصفحة
*/
resizePlayer();

/*
   عند تغيير حجم نافذة التطبيق
*/
window.addEventListener("resize", resizePlayer);

/*
   عند تغيير الاتجاه
*/
window.addEventListener("orientationchange", () => {
    setTimeout(resizePlayer, 150);
});

</script>

</body>
</html>
