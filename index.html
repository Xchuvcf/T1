<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Player</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* المشغل صغير */
.player {
    position: fixed;
    width: 400px;
    height: 225px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
}

.player iframe {
    width: 100%;
    height: 100%;

    border: 0;
    display: block;
}

/* على الشاشات الصغيرة */
@media (max-width: 430px) {
    .player {
        width: 90vw;
        height: calc(90vw * 9 / 16);
    }
}
</style>
</head>

<body>

<div class="player">

    <iframe
        src="https://912acsss8af382.yasirtv.com/playerv5.php?match=4828487"
        frameborder="0"
        scrolling="no"
        allowfullscreen
        referrerpolicy="no-referrer">
    </iframe>

</div>

<script>
"use strict";

/*
 * حماية الصفحة من النوافذ المنبثقة
 */

window.open = function () {
    return null;
};

/*
 * منع بعض طرق فتح تبويب جديد
 */

document.addEventListener("click", function (event) {

    const link = event.target.closest("a");

    if (!link) return;

    if (
        link.target === "_blank" ||
        link.target === "_new"
    ) {
        event.preventDefault();
        event.stopImmediatePropagation();
    }

}, true);


/*
 * منع إنشاء نوافذ جديدة من بعض الأحداث
 */

document.addEventListener("auxclick", function(event) {

    if (event.button === 1) {
        event.preventDefault();
    }

}, true);


/*
 * إزالة عناصر الإعلانات الشائعة الموجودة
 * في الصفحة التي نتحكم بها.
 */

function removeAds() {

    const selectors = [
        '[class*="ad-"]',
        '[class*="ads-"]',
        '[class*="advert"]',
        '[class*="banner"]',
        '[id*="ad-"]',
        '[id*="ads-"]',
        '[id*="advert"]',
        '[id*="banner"]',
        'ins.adsbygoogle'
    ];

    document.querySelectorAll(
        selectors.join(",")
    ).forEach(element => {

        if (!element.closest(".player")) {
            element.remove();
        }

    });
}


/*
 * مراقبة الصفحة وإزالة العناصر الإعلانية
 */

const observer = new MutationObserver(() => {
    removeAds();
});

observer.observe(document.documentElement, {
    childList: true,
    subtree: true
});

removeAds();

</script>

</body>
</html>
