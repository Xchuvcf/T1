<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Video Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;

    overscroll-behavior: none;
}

/* =====================================================
   الشاشة
   ===================================================== */

#stage {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =====================================================
   إطار 16:9
   ===================================================== */

#playerBox {

    position: relative;

    /*
     * أكبر مستطيل 16:9
     * يمكن أن يدخل بالكامل داخل الشاشة.
     */

    width: min(
        100vw,
        calc(100vh * 16 / 9)
    );

    height: min(
        100vh,
        calc(100vw * 9 / 16)
    );

    flex: 0 0 auto;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   YasirTV iframe
   ===================================================== */

#player {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    display: block;

    background: #000;
}
</style>
</head>

<body>

<div id="stage">

    <div id="playerBox">

        <iframe
            id="player"
            title="Video Player"

            allow="
                autoplay;
                encrypted-media;
                picture-in-picture
            "

            scrolling="no"

            referrerpolicy="no-referrer">
        </iframe>

    </div>

</div>


<script>
(function () {

    "use strict";


    /* =================================================
       الإعدادات
       ================================================= */

    const STREAMS_FILE =
        "streams.json";

    const PLAYER_HOST =
        "https://912acsss8af382.yasirtv.com";


    /* =================================================
       العناصر
       ================================================= */

    const player =
        document.getElementById("player");


    /* =================================================
       قراءة stream
       ================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const streamKey =
        params.get("stream");


    /* =================================================
       التحقق من المفتاح
       ================================================= */

    function validKey(value) {

        return (
            typeof value === "string" &&
            /^[A-Za-z0-9_-]+$/.test(value)
        );

    }


    /* =================================================
       تحميل بيانات البث
       ================================================= */

    async function loadStream() {

        try {

            if (!validKey(streamKey)) {
                throw new Error(
                    "Invalid stream key"
                );
            }


            const response =
                await fetch(
                    STREAMS_FILE +
                    "?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {
                throw new Error(
                    "Unable to load streams.json"
                );
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.streams ||
                !data.streams[streamKey]
            ) {
                throw new Error(
                    "Stream not found"
                );
            }


            const stream =
                data.streams[streamKey];


            if (
                typeof stream.match !== "string" ||
                !/^[A-Za-z0-9_-]+$/.test(
                    stream.match
                )
            ) {
                throw new Error(
                    "Invalid match ID"
                );
            }


            /* =========================================
               إنشاء رابط YasirTV
               ========================================= */

            player.src =
                PLAYER_HOST +
                "/playerv5.php?match=" +
                encodeURIComponent(
                    stream.match
                );


        } catch (error) {

            console.error(
                "Player error:",
                error
            );

            player.removeAttribute(
                "src"
            );
        }
    }


    /* =================================================
       إعادة حساب 16:9
       ================================================= */

    function updatePlayer() {

        /*
         * لا نستخدم:
         * scale
         * 92%
         * 94%
         * 96%
         * safe margin
         *
         * فقط أكبر 16:9 داخل الشاشة.
         */

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;


        const ratio =
            16 / 9;


        let playerWidth =
            width;

        let playerHeight =
            playerWidth / ratio;


        /*
         * إذا خرج من أسفل الشاشة
         * نعتمد الارتفاع.
         */

        if (
            playerHeight > height
        ) {

            playerHeight =
                height;

            playerWidth =
                playerHeight * ratio;

        }


        /*
         * تحويل إلى أرقام صحيحة
         */

        playerWidth =
            Math.floor(playerWidth);

        playerHeight =
            Math.floor(playerHeight);


        /*
         * تطبيق الحجم
         */

        const box =
            document.getElementById(
                "playerBox"
            );


        box.style.width =
            playerWidth + "px";

        box.style.height =
            playerHeight + "px";
    }


    /* =================================================
       بدء الصفحة
       ================================================= */

    updatePlayer();

    loadStream();


    /* =================================================
       عند تغيير حجم WebView
       ================================================= */

    window.addEventListener(
        "resize",
        updatePlayer,
        {
            passive: true
        }
    );


    /* =================================================
       تغيير الاتجاه
       ================================================= */

    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                updatePlayer,
                50
            );

            setTimeout(
                updatePlayer,
                200
            );

            setTimeout(
                updatePlayer,
                500
            );

        },
        {
            passive: true
        }
    );


    /* =================================================
       visualViewport
       ================================================= */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            updatePlayer,
            {
                passive: true
            }
        );

    }


    /* =================================================
       منع فتح نوافذ من صفحة الوسيط
       ================================================= */

    window.open =
        function () {
            return null;
        };


})();
</script>

</body>
</html>
