<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Player</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;
}

/*
 * مساحة المشغل
 * أصغر قليلًا من نافذة التطبيق
 */
#root {
    position: fixed;

    width: 92%;
    height: 92%;

    left: 4%;
    top: 4%;

    overflow: hidden;

    background: #000;
}

/*
 * مشغل YasirTV
 */
#player {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    border: 0;
    margin: 0;
    padding: 0;

    display: block;

    background: #000;
}
</style>
</head>

<body>

<div id="root">

    <iframe
        id="player"
        title="Video Player"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen="true"
        scrolling="no"
        referrerpolicy="no-referrer">
    </iframe>

</div>

<script>
(function () {

    "use strict";

    const params = new URLSearchParams(window.location.search);

    /*
     * مثال:
     * ?match=4828487
     */

    const match = params.get("match") || "4828487";

    /*
     * حماية رقم المباراة
     */
    if (!/^[A-Za-z0-9_-]+$/.test(match)) {
        document.body.innerHTML = "";
        return;
    }

    const player = document.getElementById("player");

    /*
     * رابط YasirTV الأصلي
     */
    player.src =
        "https://912acsss8af382.yasirtv.com/playerv5.php?match=" +
        encodeURIComponent(match);


    /*
     * تحديث الحجم عند تغيير حجم نافذة
     */
    function updateSize() {

        const width = window.innerWidth;
        const height = window.innerHeight;

        /*
         * 92% من مساحة WebView
         */
        const playerWidth = Math.floor(width * 0.92);
        const playerHeight = Math.floor(height * 0.92);

        /*
         * توسيط المشغل
         */
        const left = Math.floor((width - playerWidth) / 2);
        const top = Math.floor((height - playerHeight) / 2);

        player.style.width = playerWidth + "px";
        player.style.height = playerHeight + "px";

        player.style.left = "0px";
        player.style.top = "0px";

        const root = document.getElementById("root");

        root.style.width = playerWidth + "px";
        root.style.height = playerHeight + "px";

        root.style.left = left + "px";
        root.style.top = top + "px";
    }


    /*
     * أول تشغيل
     */
    updateSize();


    /*
     * عند تغيير حجم نافذة تطبيق المشاهدة
     */
    window.addEventListener(
        "resize",
        updateSize,
        { passive: true }
    );


    /*
     * عند تغيير اتجاه الجهاز
     */
    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                updateSize,
                300
            );

        },
        { passive: true }
    );


    /*
     * منع Pop-up من الصفحة الوسيطة
     */
    window.open = function () {
        return null;
    };


    /*
     * منع فتح تبويبات جديدة
     */
    document.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest &&
                event.target.closest("a");

            if (!link) return;

            if (link.target === "_blank") {

                event.preventDefault();

                event.stopImmediatePropagation();

            }

        },
        true
    );

})();
</script>

</body>
</html>
