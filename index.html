<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Content-Security-Policy"
      content="
      default-src 'self' https://912acsss8af382.yasirtv.com;
      frame-src https://912acsss8af382.yasirtv.com;
      img-src 'self' data:;
      style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline';
      connect-src 'self';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
      ">

<title>Player</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player {
    position: absolute;
    width: min(100vw, 640px);
    aspect-ratio: 16 / 9;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div class="player">
    <iframe
        src="https://912acsss8af382.yasirtv.com/playerv5.php?match=4828487"
        frameborder="0"
        allowfullscreen
        scrolling="no"
        referrerpolicy="no-referrer">
    </iframe>
</div>

<script>
"use strict";

/*
 * حماية الصفحة من بعض أنواع النوافذ المنبثقة
 * وإعادة التوجيه التي تحدث خارج iframe.
 */

const originalOpen = window.open;

window.open = function () {
    console.warn("Blocked popup");
    return null;
};

/* منع بعض محاولات فتح روابط جديدة */
document.addEventListener("click", function (event) {
    const link = event.target.closest("a");

    if (!link) return;

    if (link.target === "_blank") {
        event.preventDefault();
        event.stopPropagation();
    }
}, true);

/* محاولة تثبيت الاتجاه الأفقي */
async function lockLandscape() {
    try {
        if (screen.orientation &&
            screen.orientation.lock) {

            await screen.orientation.lock("landscape");
        }
    } catch (error) {
        console.log("Landscape lock unavailable");
    }
}

lockLandscape();

/* عند الدخول إلى وضع ملء الشاشة نحاول تثبيت Landscape */
document.addEventListener("fullscreenchange", lockLandscape);
</script>

</body>
</html>
